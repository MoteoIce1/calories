<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Трекер Диеты КБЖУ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { background-color: #000; margin: 0; padding: 0; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .safe-pb { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    .fast-touch { touch-action: manipulation; }
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    .loader { border: 3px solid #27272a; border-top: 3px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyBg9rVgF6WUjuu9abFvV_1KCHdSW3fZ5uQ",
      authDomain: "my-test-db-de78c.firebaseapp.com",
      projectId: "my-test-db-de78c",
      storageBucket: "my-test-db-de78c.firebasestorage.app",
      messagingSenderId: "30801099639",
      appId: "1:30801099639:web:585da0bba1f27d4a6fff72",
      measurementId: "G-KW2YVT1ZJW"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      firebase.firestore().enablePersistence().catch((err) => {
        console.warn("Firebase persistence error:", err.code);
      });
    }
    const db = firebase.firestore();
    const docRef = db.collection('users').doc('main_profile');

    const { useState, useEffect, useRef } = React;

    const IconPlus = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14m-7-7h14"/></svg>;
    const IconBook = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
    const IconCalendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconChevronLeft = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconChevronRight = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconTrash = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>;
    const IconTarget = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconCheck = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
    const IconDownload = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>;
    const IconStar = ({className, fill="none"}) => <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>;
    const IconRefresh = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>;

    const HARDCODED_FOODS = [
      { id: 'h1', name: 'Котлета (говядина)', calories: 255, protein: 25, fats: 17, carbs: 0, isFavorite: false },
      { id: 'h2', name: 'Котлеты куриные', calories: 160, protein: 16, fats: 9, carbs: 4, isFavorite: false },
      { id: 'h4', name: 'Куриное филе (сырое)', calories: 113, protein: 23.6, fats: 1.9, carbs: 0, isFavorite: false },
      { id: 'h7', name: 'Гречка вареная', calories: 132, protein: 4.5, fats: 1.1, carbs: 26, isFavorite: false },
      { id: 'h13', name: 'Помидор', calories: 19, protein: 1, fats: 0.2, carbs: 4, isFavorite: false },
      { id: 'h14', name: 'Огурец', calories: 15, protein: 1, fats: 0.1, carbs: 3, isFavorite: false },
      { id: 'h18', name: 'Яйцо куриное (на 100г)', calories: 155, protein: 13, fats: 11, carbs: 1, isFavorite: false },
    ];

    const MacroBar = ({ label, current, goal, colorClass, bgClass }) => {
      const numGoal = Number(goal) || 1;
      const progress = Math.min(100, (current / numGoal) * 100);
      const remaining = Math.max(0, (Number(goal) || 0) - Math.round(current));
      return (
        <div className="w-full">
          <div className="flex justify-between items-end mb-1">
            <p className="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">{label}</p>
            <span className={`text-[11px] font-bold ${colorClass}`}>{Math.round(current)} / {goal || 0}</span>
          </div>
          <div className="h-2 w-full bg-zinc-900 rounded-full overflow-hidden mb-1">
            <div className={`h-full transition-all duration-500 ${bgClass}`} style={{ width: `${progress}%` }}></div>
          </div>
          <p className="text-[9px] text-zinc-500 font-bold uppercase text-right opacity-80">Ост: {remaining}</p>
        </div>
      );
    };

    const getLocalDateString = (dateObj) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getDefaultStartDate = () => {
      const d = new Date();
      d.setMonth(d.getMonth() - 1);
      return getLocalDateString(d);
    };

    const displayDate = (dateString) => {
      const [year, month, day] = dateString.split('-');
      const d = new Date(year, month - 1, day);
      const todayStr = getLocalDateString(new Date());
      if (dateString === todayStr) return 'Сегодня';
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (dateString === getLocalDateString(yesterday)) return 'Вчера';
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      
      const defaultGoals = { calories: 1800, protein: 150, fats: 60, carbs: 150, baseSteps: 6000, maintenance: 2300 };
      const [goals, setGoals] = useState(defaultGoals);
      const [draftGoals, setDraftGoals] = useState(defaultGoals);
      const [dailyGoals, setDailyGoals] = useState({});
      
      const [foods, setFoods] = useState([]);
      const [dailyLogs, setDailyLogs] = useState({});
      const [dailySteps, setDailySteps] = useState({});
      const [dailyMetrics, setDailyMetrics] = useState({});
      
      const [currentDate, setCurrentDate] = useState(getLocalDateString(new Date()));
      const [activeTab, setActiveTab] = useState('diary');
      
      const [selectedFoodId, setSelectedFoodId] = useState('');
      const [gramsInput, setGramsInput] = useState('');
      const [newFood, setNewFood] = useState({ name: '', cals: '', pro: '', fat: '', carb: '' });

      const [editingLogId, setEditingLogId] = useState(null);
      const [editingFoodId, setEditingFoodId] = useState(null);
      const [editValue, setEditValue] = useState({});

      const [showExportModal, setShowExportModal] = useState(false);
      const [showGoalModal, setShowGoalModal] = useState(false);
      const [exportStart, setExportStart] = useState(getDefaultStartDate());
      const [exportEnd, setExportEnd] = useState(getLocalDateString(new Date()));

      const scrollContainerRef = useRef(null);

      useEffect(() => {
        const unsubscribe = docRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.goals) {
                setGoals({...goals, ...data.goals});
                if (isLoading) setDraftGoals({...goals, ...data.goals});
            }
            if (data.dailyGoals) setDailyGoals(data.dailyGoals);
            if (data.foods) setFoods(data.foods);
            if (data.dailyLogs) setDailyLogs(data.dailyLogs);
            if (data.dailySteps) setDailySteps(data.dailySteps);
            if (data.dailyMetrics) setDailyMetrics(data.dailyMetrics);
          } else {
            setFoods(HARDCODED_FOODS);
          }
          setIsLoading(false);
        }, (error) => {
           console.log("Firebase error", error);
           setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (scrollContainerRef.current) scrollContainerRef.current.scrollTop = 0;
      }, [activeTab]);

      const handleDraftGoalChange = (field, val) => {
        setDraftGoals({ ...draftGoals, [field]: val });
      };

      const confirmGoalSave = (mode) => {
        if (!confirm('Вы уверены, что хотите применить новые настройки?')) return;
        
        let updatedDailyGoals = { ...dailyGoals };

        if (mode === 'all') {
            updatedDailyGoals = {}; 
        } else if (mode === 'today') {
            const allDates = new Set([...Object.keys(dailyLogs), ...Object.keys(dailySteps)]);
            const todayStr = getLocalDateString(new Date());
            
            allDates.forEach(date => {
                if (date < todayStr && !updatedDailyGoals[date]) {
                    updatedDailyGoals[date] = { ...goals };
                }
            });
        }

        docRef.set({ goals: draftGoals, dailyGoals: updatedDailyGoals }, { merge: true });
        setGoals(draftGoals);
        setDailyGoals(updatedDailyGoals);
        setShowGoalModal(false);
      };

      const getEffectiveGoals = (date) => {
          return dailyGoals[date] || goals;
      };

      const handleUpdateSteps = (val) => {
        const num = parseInt(val);
        const updated = { ...dailySteps, [currentDate]: isNaN(num) ? '' : num };
        setDailySteps(updated);
        docRef.set({ dailySteps: updated }, { merge: true });
      };

      const handleUpdateMetrics = (field, val) => {
        const num = parseFloat(val);
        const currentDayMetrics = dailyMetrics[currentDate] || {};
        const updatedDay = { ...currentDayMetrics, [field]: isNaN(num) ? '' : num };
        const updated = { ...dailyMetrics, [currentDate]: updatedDay };
        setDailyMetrics(updated);
        docRef.set({ dailyMetrics: updated }, { merge: true });
      };

      const handleAddLog = (e) => {
        e.preventDefault();
        const food = foods.find(f => f.id === selectedFoodId);
        if (!food || !gramsInput) return;
        const grams = parseFloat(gramsInput);
        const newLog = {
          id: Date.now().toString(),
          foodId: food.id,
          grams,
          totalCalories: Math.round((grams / 100) * (food.calories || 0)),
          totalProtein: Math.round((grams / 100) * (food.protein || 0)),
          totalFats: Math.round((grams / 100) * (food.fats || 0)),
          totalCarbs: Math.round((grams / 100) * (food.carbs || 0))
        };
        const updatedLogs = { ...dailyLogs, [currentDate]: [...(dailyLogs[currentDate] || []), newLog] };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
        setSelectedFoodId(''); setGramsInput('');
      };

      const updateLogWeight = (logId, newGrams) => {
        const grams = parseFloat(newGrams) || 0;
        const dayLogs = dailyLogs[currentDate].map(log => {
          if (log.id === logId) {
            const food = foods.find(f => f.id === log.foodId);
            return {
              ...log, grams,
              totalCalories: Math.round((grams / 100) * (food?.calories || 0)),
              totalProtein: Math.round((grams / 100) * (food?.protein || 0)),
              totalFats: Math.round((grams / 100) * (food?.fats || 0)),
              totalCarbs: Math.round((grams / 100) * (food?.carbs || 0))
            };
          }
          return log;
        });
        const updatedLogs = { ...dailyLogs, [currentDate]: dayLogs };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
        setEditingLogId(null);
      };

      const deleteLog = (id) => {
        const updatedLogs = { ...dailyLogs, [currentDate]: dailyLogs[currentDate].filter(l => l.id !== id) };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
      };

      const handleAddFood = (e) => {
        e.preventDefault();
        const foodItem = {
          id: Date.now().toString(),
          name: newFood.name,
          calories: Math.round(parseFloat(newFood.cals || 0)),
          protein: Math.round(parseFloat(newFood.pro || 0)),
          fats: Math.round(parseFloat(newFood.fat || 0)),
          carbs: Math.round(parseFloat(newFood.carb || 0)),
          isFavorite: false
        };
        const updatedFoods = [foodItem, ...foods];
        setFoods(updatedFoods);
        docRef.set({ foods: updatedFoods }, { merge: true });
        setNewFood({ name: '', cals: '', pro: '', fat: '', carb: '' });
      };

      const updateFoodBase = (id) => {
        const updatedFoods = foods.map(f => f.id === id ? { 
            ...f, 
            name: editValue.name,
            calories: Math.round(parseFloat(editValue.calories || 0)),
            protein: Math.round(parseFloat(editValue.protein || 0)),
            fats: Math.round(parseFloat(editValue.fats || 0)),
            carbs: Math.round(parseFloat(editValue.carbs || 0))
        } : f);
        setFoods(updatedFoods);
        
        const updatedLogs = { ...dailyLogs };
        Object.keys(updatedLogs).forEach(date => {
          updatedLogs[date] = updatedLogs[date].map(log => {
            if (log.foodId === id) {
              const grams = log.grams;
              return {
                ...log,
                totalCalories: Math.round((grams / 100) * (editValue.calories || 0)),
                totalProtein: Math.round((grams / 100) * (editValue.protein || 0)),
                totalFats: Math.round((grams / 100) * (editValue.fats || 0)),
                totalCarbs: Math.round((grams / 100) * (editValue.carbs || 0))
              };
            }
            return log;
          });
        });

        setDailyLogs(updatedLogs);
        docRef.set({ foods: updatedFoods, dailyLogs: updatedLogs }, { merge: true });
        setEditingFoodId(null);
      };

      const deleteFood = (e, id) => {
        e.stopPropagation();
        const updatedFoods = foods.filter(x => x.id !== id);
        setFoods(updatedFoods);
        docRef.set({ foods: updatedFoods }, { merge: true });
      };

      const toggleFavorite = (e, id, currentStatus) => {
        e.stopPropagation();
        const updatedFoods = foods.map(f => f.id === id ? { ...f, isFavorite: !currentStatus } : f);
        setFoods(updatedFoods);
        docRef.set({ foods: updatedFoods }, { merge: true });
      };

      const generatePDF = () => {
        const element = document.getElementById('pdf-export-container');
        element.style.display = 'block';
        
        // Даем 500мс для рендера таблицы, после чего сохраняем PDF
        setTimeout(() => {
          const opt = {
            margin:       [10, 5, 10, 5], // Уменьшили боковые отступы на листе А4
            filename:     `Отчет_${exportStart}_${exportEnd}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, logging: false, windowWidth: 820 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none';
            setShowExportModal(false);
          }).catch((err) => {
            console.error("Ошибка генерации PDF:", err);
            element.style.display = 'none';
            setShowExportModal(false);
          });
        }, 500); 
      };

      const forceRefreshApp = () => {
        window.location.href = window.location.pathname + '?v=' + Date.now();
      };

      const activeGoals = getEffectiveGoals(currentDate);
      const baseStepsGoal = activeGoals.baseSteps || 6000;
      const baseMaintenance = activeGoals.maintenance || 2300;
      
      const todaySteps = dailySteps[currentDate] !== undefined ? dailySteps[currentDate] : baseStepsGoal;
      const extraCalories = todaySteps > baseStepsGoal ? Math.round((todaySteps - baseStepsGoal) * 0.04) : 0;
      const targetCalories = (Number(activeGoals.calories) || 0) + extraCalories;

      const currentDayLogs = dailyLogs[currentDate] || [];
      const totalCals = currentDayLogs.reduce((sum, log) => sum + (log.totalCalories || 0), 0);
      const totalPro = currentDayLogs.reduce((sum, log) => sum + (log.totalProtein || 0), 0);
      const totalFats = currentDayLogs.reduce((sum, log) => sum + (log.totalFats || 0), 0);
      const totalCarbs = currentDayLogs.reduce((sum, log) => sum + (log.totalCarbs || 0), 0);
      
      const isOver = totalCals > targetCalories;
      const displayCals = isOver ? (totalCals - targetCalories) : (targetCalories - totalCals);
      const calsColorClass = isOver ? "text-red-500" : "text-emerald-400";
      const calsLabel = isOver ? "перебор" : "осталось";
      
      const progressCals = Math.min(100, (totalCals / (targetCalories || 1)) * 100);
      
      const sortedFoods = [...foods].sort((a, b) => {
        if (a.isFavorite && !b.isFavorite) return -1;
        if (!a.isFavorite && b.isFavorite) return 1;
        return a.name.localeCompare(b.name, 'ru');
      });

      const filteredDatesForPdf = Object.keys(dailyLogs)
        .filter(date => date >= exportStart && date <= exportEnd)
        .sort((a, b) => new Date(a) - new Date(b));

      let totalPeriodCals = 0;
      let totalPeriodBurned = 0;
      let totalPeriodSteps = 0;

      // Массивы для общей таблицы прогресса
      const chartWeight = [];
      const chartFat = [];
      const chartLean = [];
      const chartFatMass = [];
      
      filteredDatesForPdf.forEach(date => {
          const dayActiveGoals = getEffectiveGoals(date);
          const bSteps = dayActiveGoals.baseSteps || 6000;
          const bMaint = dayActiveGoals.maintenance || 2300;

          const dayLogs = dailyLogs[date] || [];
          const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
          const daySteps = dailySteps[date] !== undefined ? dailySteps[date] : bSteps;
          const extraCals = daySteps > bSteps ? Math.round((daySteps - bSteps) * 0.04) : 0;
          const dayBurned = bMaint + extraCals;

          totalPeriodCals += dayCals;
          totalPeriodBurned += dayBurned;
          totalPeriodSteps += daySteps;

          const m = dailyMetrics[date];
          if (m) {
             chartWeight.push(m.weight);
             chartFat.push(m.fatPercent);
             chartLean.push(m.leanMass);
             chartFatMass.push(m.fatMass);
          }
      });

      const periodDeficit = totalPeriodBurned - totalPeriodCals;
      const avgDeficit = filteredDatesForPdf.length ? Math.round(periodDeficit / filteredDatesForPdf.length) : 0;
      const periodDefText = periodDeficit > 0 ? `Дефицит: +${periodDeficit} ккал 🔥` : `Профицит: ${Math.abs(periodDeficit)} ккал 📈`;

      // Расчет первого и последнего значения для таблицы прогресса
      const getFirstValid = (arr) => arr.find(v => v !== null && v !== undefined && !isNaN(v));
      const getLastValid = (arr) => [...arr].reverse().find(v => v !== null && v !== undefined && !isNaN(v));

      const wStart = getFirstValid(chartWeight), wEnd = getLastValid(chartWeight);
      const fStart = getFirstValid(chartFat), fEnd = getLastValid(chartFat);
      const lStart = getFirstValid(chartLean), lEnd = getLastValid(chartLean);
      const fmStart = getFirstValid(chartFatMass), fmEnd = getLastValid(chartFatMass);

      const hasBodyData = wStart !== undefined || fStart !== undefined || lStart !== undefined || fmStart !== undefined;

      const datesWithMetrics = filteredDatesForPdf.filter(date => {
         const m = dailyMetrics[date];
         return m && (m.weight || m.fatPercent || m.leanMass || m.fatMass);
      });

      const hasUnsavedGoals = JSON.stringify(goals) !== JSON.stringify(draftGoals);

      if (isLoading) {
        return (
          <div className="flex h-[100dvh] items-center justify-center bg-[#09090b] flex-col gap-4">
            <div className="loader"></div>
            <p className="text-zinc-500 font-bold text-sm tracking-widest uppercase">Загрузка...</p>
          </div>
        );
      }

      return (
        <div className="flex flex-col h-[100dvh] w-full max-w-md mx-auto bg-[#09090b] text-zinc-100 font-sans shadow-2xl border-x border-zinc-900 relative">
          
          <header className="shrink-0 pt-8 px-6 pb-4 bg-[#09090b] flex justify-between items-center z-10">
            <div>
              <h1 className="text-2xl font-bold">
                {activeTab === 'diary' ? 'Дневник' : 'База'}
              </h1>
            </div>
            <div className="flex items-center gap-2">
              {activeTab === 'directory' && (
                <button onClick={forceRefreshApp} className="fast-touch p-2 bg-zinc-800 rounded-xl text-zinc-300 active:scale-95 transition-transform" title="Обновить код">
                  <IconRefresh className="w-5 h-5" />
                </button>
              )}
              
              {activeTab === 'diary' && (
                <button onClick={() => setShowExportModal(true)} className="fast-touch p-2 bg-zinc-800 rounded-xl text-zinc-300 active:scale-95 transition-transform">
                  <IconDownload className="w-5 h-5" />
                </button>
              )}
            </div>
          </header>

          <main ref={scrollContainerRef} className="flex-1 overflow-y-auto px-5 pt-2 pb-8">
            
            {activeTab === 'diary' && (

                   <p style={{ margin: '6px 0', fontSize: '14px', color: '#555' }}><em>(В среднем {avgDeficit} ккал/день)</em></p>
                </div>
                
                {hasBodyData && (
                  <div style={{ marginTop: '20px', paddingTop: '15px', borderTop: '1px solid #d4d4d8' }}>
                    <h3 style={{ fontSize: '18px', fontWeight: 'bold', margin: '0 0 12px 0', color: '#005f73' }}>Изменения по телу:</h3>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '15px', textAlign: 'center', backgroundColor: '#fff' }}>
                      <thead>
                        <tr style={{ backgroundColor: '#e2e8f0' }}>
                          <th style={{ padding: '10px', border: '1px solid #cbd5e1', width: '25%', textAlign: 'left' }}>Показатель</th>
                          <th style={{ padding: '10px', border: '1px solid #cbd5e1', width: '25%' }}>Начало</th>
                          <th style={{ padding: '10px', border: '1px solid #cbd5e1', width: '25%' }}>Конец</th>
                          <th style={{ padding: '10px', border: '1px solid #cbd5e1', width: '25%' }}>Разница</th>
                        </tr>
                      </thead>
                      <tbody>
                        {wStart !== undefined && wEnd !== undefined && (
                          <tr>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', textAlign: 'left', fontWeight: 'bold' }}>Вес (кг)</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{wStart}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{wEnd}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', fontWeight: 'bold', color: (wEnd - wStart) > 0 ? '#ef4444' : '#10b981' }}>
                               {((wEnd - wStart) > 0 ? '+' : '') + (wEnd - wStart).toFixed(1)}
                            </td>
                          </tr>
                        )}
                        {fStart !== undefined && fEnd !== undefined && (
                          <tr>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', textAlign: 'left', fontWeight: 'bold' }}>Жир (%)</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{fStart}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{fEnd}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', fontWeight: 'bold', color: (fEnd - fStart) > 0 ? '#ef4444' : '#10b981' }}>
                               {((fEnd - fStart) > 0 ? '+' : '') + (fEnd - fStart).toFixed(1)}
                            </td>
                          </tr>
                        )}
                        {lStart !== undefined && lEnd !== undefined && (
                          <tr>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', textAlign: 'left', fontWeight: 'bold' }}>БЖМ (кг)</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{lStart}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{lEnd}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', fontWeight: 'bold', color: (lEnd - lStart) > 0 ? '#10b981' : '#ef4444' }}>
                               {((lEnd - lStart) > 0 ? '+' : '') + (lEnd - lStart).toFixed(1)}
                            </td>
                          </tr>
                        )}
                        {fmStart !== undefined && fmEnd !== undefined && (
                          <tr>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', textAlign: 'left', fontWeight: 'bold' }}>Масса жира (кг)</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{fmStart}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1' }}>{fmEnd}</td>
                            <td style={{ padding: '10px', border: '1px solid #cbd5e1', fontWeight: 'bold', color: (fmEnd - fmStart) > 0 ? '#ef4444' : '#10b981' }}>
                               {((fmEnd - fmStart) > 0 ? '+' : '') + (fmEnd - fmStart).toFixed(1)}
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {datesWithMetrics.length > 0 && (
               <div style={{ marginBottom: '40px' }}>
                  <h3 style={{ fontSize: '20px', fontWeight: 'bold', margin: '0 0 15px 0', color: '#005f73' }}>Динамика тела по дням:</h3>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px', textAlign: 'center', backgroundColor: '#fff' }}>
                     <thead>
                        <tr style={{ backgroundColor: '#e2e8f0' }}>
                           <th style={{ padding: '8px', border: '1px solid #cbd5e1', width: '20%', textAlign: 'left' }}>Дата</th>
                           <th style={{ padding: '8px', border: '1px solid #cbd5e1', width: '20%' }}>Вес (кг)</th>
                           <th style={{ padding: '8px', border: '1px solid #cbd5e1', width: '20%' }}>Жир (%)</th>
                           <th style={{ padding: '8px', border: '1px solid #cbd5e1', width: '20%' }}>БЖМ (кг)</th>
                           <th style={{ padding: '8px', border: '1px solid #cbd5e1', width: '20%' }}>Масса жира</th>
                        </tr>
                     </thead>
                     <tbody>
                        {datesWithMetrics.map(date => {
                           const m = dailyMetrics[date] || {};
                           return (
                              <tr key={date}>
                                 <td style={{ padding: '8px', border: '1px solid #cbd5e1', textAlign: 'left', fontWeight: 'bold' }}>{date}</td>
                                 <td style={{ padding: '8px', border: '1px solid #cbd5e1' }}>{m.weight || '-'}</td>
                                 <td style={{ padding: '8px', border: '1px solid #cbd5e1' }}>{m.fatPercent || '-'}</td>
                                 <td style={{ padding: '8px', border: '1px solid #cbd5e1' }}>{m.leanMass || '-'}</td>
                                 <td style={{ padding: '8px', border: '1px solid #cbd5e1' }}>{m.fatMass || '-'}</td>
                              </tr>
                           )
                        })}
                     </tbody>
                  </table>
               </div>
            )}

            {filteredDatesForPdf.length === 0 ? (
              <p>За выбранный период нет данных.</p>
            ) : (
              filteredDatesForPdf.map(date => {
                const dayActiveGoals = getEffectiveGoals(date);
                const bSteps = dayActiveGoals.baseSteps || 6000;
                const bMaint = dayActiveGoals.maintenance || 2300;

                const dayLogs = dailyLogs[date] || [];
                const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
                const dayPro = dayLogs.reduce((s, l) => s + (l.totalProtein || 0), 0);
                const dayFat = dayLogs.reduce((s, l) => s + (l.totalFats || 0), 0);
                const dayCarb = dayLogs.reduce((s, l) => s + (l.totalCarbs || 0), 0);

                const daySteps = dailySteps[date] !== undefined ? dailySteps[date] : bSteps;
                const extraCals = daySteps > bSteps ? Math.round((daySteps - bSteps) * 0.04) : 0;
                const dayBurned = bMaint + extraCals;
                const dayDeficit = dayBurned - dayCals;
                const dayDefText = dayDeficit > 0 ? `Дефицит: +${dayDeficit} ккал 🔥` : `Профицит: ${Math.abs(dayDeficit)} ккал 📈`;

                const m = dailyMetrics[date] || {};
                const mText = [
                  m.weight ? `Вес: ${m.weight} кг` : '',
                  m.fatPercent ? `Жир: ${m.fatPercent}%` : '',
                  m.leanMass ? `БЖМ: ${m.leanMass} кг` : '',
                  m.fatMass ? `Жир: ${m.fatMass} кг` : ''
                ].filter(Boolean).join(' | ');

                return (
                  <div key={date} style={{ marginBottom: '30px', pageBreakInside: 'avoid' }}>
                    <h2 style={{ fontSize: '18px', fontWeight: 'bold', borderBottom: '2px solid #10b981', paddingBottom: '5px', margin: '0 0 8px 0' }}>
                      {date}
                    </h2>
                    <p style={{ margin: '0 0 10px 0', fontSize: '14px', color: '#444', lineHeight: '1.6' }}>
                      Шаги: {daySteps} | Съедено: {dayCals} ккал | Потрачено: {dayBurned} ккал<br/>
                      <span style={{ fontSize: '15px', color: '#000' }}><strong>Итог дня:</strong> {dayDefText}</span><br/>
                      Б: {Math.round(dayPro)}г | Ж: {Math.round(dayFat)}г | У: {Math.round(dayCarb)}г
                      {mText && <span><br/><span style={{ color: '#005f73' }}><strong>Тело:</strong> {mText}</span></span>}
                    </p>
                    <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '14px' }}>
                      <thead>
                        <tr style={{ backgroundColor: '#f4f4f5', textAlign: 'left' }}>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '35%' }}>Продукт</th>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '13%' }}>Вес (г)</th>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '13%' }}>Ккал</th>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '13%' }}>Белки</th>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '13%' }}>Жиры</th>
                          <th style={{ padding: '8px', border: '1px solid #e4e4e7', width: '13%' }}>Углеводы</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dayLogs.map((log, i) => (
                          <tr key={i}>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{foods.find(f => f.id === log.foodId)?.name || 'Удаленный продукт'}</td>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{log.grams}</td>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{Math.round(log.totalCalories || 0)}</td>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{Math.round(log.totalProtein || 0)}</td>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{Math.round(log.totalFats || 0)}</td>
                            <td style={{ padding: '8px', border: '1px solid #e4e4e7' }}>{Math.round(log.totalCarbs || 0)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
              })
            )}
          </div>
          
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
