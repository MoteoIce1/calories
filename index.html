  <!--
    ВАЖНО ПО БЕЗОПАСНОСТИ:
    Приложение пишет в один документ Firestore (users/main_profile) без аутентификации.
    Раз код лежит публично на GitHub, обязательно закрой правила Firestore, иначе любой
    желающий сможет читать и перезаписывать твою базу.
    Минимальный безопасный вариант правил (Firebase Console -> Firestore -> Rules):

      rules_version = '2';
      service cloud.firestore {
        match /databases/{database}/documents {
          // только для анонимной/залогиненной сессии
          match /{document=**} {
            allow read, write: if request.auth != null;
          }
        }
      }

    Для этого надо включить Anonymous-провайдер (Authentication -> Sign-in method)
    и добавить вход через signInAnonymously. Это отдельный шаг — он меняет схему
    хранения, поэтому в этот файл я его не вшивал, чтобы не потерять твои текущие данные.
  -->

  <script type="text/babel">
    const firebaseConfig = {

    // Сколько ккал в 1 кг изменения массы тела (грубая константа для оценки TDEE)
    const KCAL_PER_KG = 7700;

    const evaluateMath = (expr) => {
      if (!expr) return 0;
      try {
        let safeStr = expr.toString().replace(/,/g, '.');
        safeStr = safeStr.replace(/[^\d.\-+*/()]/g, '');
        if (!safeStr) return 0;
        const result = new Function('return ' + safeStr)();
        return Math.max(0, Math.round(result * 10) / 10);
      } catch (e) {
        return 0;
      }
    };

    // Скользящее среднее по точкам взвешивания (окно = window последних валидных значений).
    // Сглаживает дневной шум веса/жира (вода, гликоген, соль) и показывает реальный тренд.
    const calcMovingAverage = (data, window = 7) => {
      return data.map((_, i) => {
        const slice = [];
        for (let j = Math.max(0, i - window + 1); j <= i; j++) {
          const v = data[j];
          if (v !== null && v !== undefined && !isNaN(v) && v !== '') slice.push(Number(v));
        }
        if (slice.length === 0) return null;
        return Math.round((slice.reduce((a, b) => a + b, 0) / slice.length) * 100) / 100;
      });
    };

    const getFirstValidVal = (arr) => arr.find(v => v !== null && v !== undefined && !isNaN(v) && v !== '');
    const getLastValidVal = (arr) => [...arr].reverse().find(v => v !== null && v !== undefined && !isNaN(v) && v !== '');

    // Универсальное скачивание файла на клиенте.
    // Примечание: на iOS в режиме PWA файл может открыться в новой вкладке / системном меню "Поделиться"
    // вместо прямого скачивания — это норма для Safari.
    const downloadFile = (filename, content, mime) => {
      try {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (e) {
        alert('Не удалось сформировать файл: ' + e.message);
      }
    };

    // CSV-экранирование для разделителя ";" (удобно для русского Excel)
    const csvCell = (val) => {
      if (val === null || val === undefined) return '';
      const s = String(val);
      if (s.includes(';') || s.includes('"') || s.includes('\n')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    };

    const IconStar = ({className, fill}) => <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;

    const IconBook = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
    const IconCalendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconChevronLeft = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconChevronRight = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconTrash = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>;
    const IconTarget = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconCheck = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;

    const IconRefresh = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>;
    const IconSearch = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>;
    const IconCopy = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>;
    const IconDumbbell = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6.5 6.5 11 11"/><path d="m21 21-1-1"/><path d="m3 3 1 1"/><path d="m18 22 4-4"/><path d="m2 6 4-4"/><path d="m3 10 7-7"/><path d="m14 21 7-7"/></svg>;

    const HARDCODED_FOODS = [
      { id: 'h1', name: 'Котлета (говядина)', calories: 255, protein: 25, fats: 17, carbs: 0, isFavorite: false },
      { id: 'h2', name: 'Котлеты куриные', calories: 160, protein: 16, fats: 9, carbs: 4, isFavorite: false },
      { id: 'h4', name: 'Куриное филе (сырое)', calories: 113, protein: 23.6, fats: 1.9, carbs: 0, isFavorite: false },
      { id: 'h7', name: 'Гречка вареная', calories: 132, protein: 4.5, fats: 1.1, carbs: 26, isFavorite: false },
      { id: 'h13', name: 'Помидор', calories: 19, protein: 1, fats: 0.2, carbs: 4, isFavorite: false },
      { id: 'h14', name: 'Огурец', calories: 15, protein: 1, fats: 0.1, carbs: 3, isFavorite: false },
      { id: 'h18', name: 'Яйцо куриное (на 100г)', calories: 155, protein: 13, fats: 11, carbs: 1, isFavorite: false },
    ];

    const MacroBar = ({ label, current, goal, colorClass, bgClass }) => {
      const numGoal = Number(goal) || 1;
      const progress = Math.min(100, (current / numGoal) * 100);
      const remaining = Math.max(0, (Number(goal) || 0) - Math.round(current));
      return (
        <div className="w-full">
          <div className="flex justify-between items-end mb-1">
            <p className="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">{label}</p>
            <span className={`text-[11px] font-bold ${colorClass}`}>{Math.round(current)} / {goal || 0}</span>
          </div>
          <div className="h-2 w-full bg-zinc-900 rounded-full overflow-hidden mb-1">
            <div className={`h-full transition-all duration-500 ${bgClass}`} style={{ width: `${progress}%` }}></div>
          </div>
          <p className="text-[9px] text-zinc-500 font-bold uppercase text-right opacity-80">Ост: {remaining}</p>
        </div>
      );
    };

    // Линейный график (SVG) с опциональной линией скользящего среднего.
    // data — массив значений по точкам взвешивания (могут быть пропуски null).
    // maData — массив сглаженных значений того же размера (необязательно).
    const ProgressChart = ({ title, data, maData, dates, color }) => {
      if (!data || data.length < 2) return null;
      const pts = data
        .map((v, i) => ({ v: Number(v), i }))
        .filter(p => data[p.i] !== null && data[p.i] !== undefined && !isNaN(data[p.i]) && data[p.i] !== '');
      if (pts.length < 2) return null;

      const maPts = (maData || [])
        .map((v, i) => ({ v: Number(v), i }))
        .filter(p => maData && maData[p.i] !== null && maData[p.i] !== undefined && !isNaN(maData[p.i]) && maData[p.i] !== '');

      const allVals = pts.map(p => p.v).concat(maPts.map(p => p.v));
      const min = Math.min(...allVals);
      const max = Math.max(...allVals);
      const range = (max - min) === 0 ? 1 : (max - min);
      const padding = range * 0.15;
      const yMin = min - padding;
      const yMax = max + padding;

      const W = 600, H = 240;
      const padL = 8, padR = 8, padT = 12, padB = 8;
      const n = data.length;
      const xFor = (i) => n <= 1 ? padL : padL + (i / (n - 1)) * (W - padL - padR);
      const yFor = (v) => padT + (1 - (v - yMin) / (yMax - yMin)) * (H - padT - padB);

      const linePoints = pts.map(p => `${xFor(p.i).toFixed(1)},${yFor(p.v).toFixed(1)}`).join(' ');
      const maLinePoints = maPts.map(p => `${xFor(p.i).toFixed(1)},${yFor(p.v).toFixed(1)}`).join(' ');

      return (
        <div className="avoid-break w-full box-border font-sans bg-white border border-slate-200 rounded-xl p-3">
          <h4 className="text-sm font-bold mb-2 text-center text-slate-800">{title}</h4>

          <div className="flex h-[150px]">
            <div className="flex flex-col justify-between pr-2 text-[9px] text-slate-500 border-r border-slate-300 text-right shrink-0 w-[35px]">
              <span>{yMax.toFixed(1)}</span>
              <span>{((yMax + yMin) / 2).toFixed(1)}</span>
              <span>{yMin.toFixed(1)}</span>
            </div>

            <div className="flex-1 pl-1">
              <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="xMidYMid meet" style={{ width: '100%', height: '100%' }}>
                <line x1={padL} y1={H - padB} x2={W - padR} y2={H - padB} stroke="#e2e8f0" strokeWidth="1" />
                {maLinePoints && (
                  <polyline points={maLinePoints} fill="none" stroke="#0f172a" strokeWidth="2" strokeDasharray="6 4" strokeLinejoin="round" strokeLinecap="round" opacity="0.65" />
                )}
                <polyline points={linePoints} fill="none" stroke={color} strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
                {pts.map((p, k) => (
                  <circle key={k} cx={xFor(p.i)} cy={yFor(p.v)} r="3.5" fill={color} />
                ))}
              </svg>
            </div>
          </div>

          {maLinePoints && (
            <div className="flex justify-center gap-4 mt-1 text-[9px] text-slate-500">
              <span className="flex items-center gap-1"><span style={{ width: '14px', height: '3px', backgroundColor: color, display: 'inline-block', borderRadius: '2px' }}></span>факт</span>
              <span className="flex items-center gap-1"><span style={{ width: '14px', height: '0', borderTop: '2px dashed #0f172a', display: 'inline-block' }}></span>сглажено (7)</span>
            </div>
          )}

          <div className="text-[9px] text-slate-500 mt-1 font-bold flex justify-between pl-[40px]">
            <span>{dates[0]}</span>
            <span>{dates[dates.length - 1]}</span>
          </div>
        </div>
      );
    };

    // Выпадающий список продуктов с поиском (замена обычного select).
    const SearchableSelect = ({ foods, value, onChange }) => {
      const [open, setOpen] = useState(false);
      const [query, setQuery] = useState('');
      const selected = foods.find(f => f.id === value);
      const filtered = foods.filter(f => f.name.toLowerCase().includes(query.toLowerCase().trim()));

      const pick = (id) => {
        onChange(id);
        setQuery('');
        setOpen(false);
      };

      return (
        <div className="relative">
          <button
            type="button"
            onClick={() => setOpen(true)}
            className="w-full bg-[#27272a] rounded-2xl p-4 text-left text-zinc-200 text-sm font-medium truncate border border-zinc-700/30 focus:border-emerald-500 flex justify-between items-center"
          >
            <span className={selected ? '' : 'text-zinc-500'}>
              {selected ? `${selected.isFavorite ? '⭐️ ' : ''}${selected.name}` : 'Выберите продукт'}
            </span>
            <IconSearch className="w-4 h-4 text-zinc-500 shrink-0 ml-2" />
          </button>

          {open && (
            <>
              <div className="fixed inset-0 z-40" onClick={() => setOpen(false)}></div>
              <div className="absolute z-50 mt-2 w-full bg-[#1f1f23] border border-zinc-700 rounded-2xl shadow-2xl overflow-hidden">
                <div className="p-2 border-b border-zinc-800">
                  <input
                    autoFocus
                    type="text"
                    placeholder="Поиск продукта..."
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    className="w-full bg-[#27272a] rounded-xl p-3 text-sm outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500"
                  />
                </div>
                <div className="max-h-60 overflow-y-auto">
                  {filtered.length === 0 && (
                    <div className="p-4 text-center text-zinc-500 text-sm">Ничего не найдено</div>
                  )}
                  {filtered.map(f => (
                    <button
                      key={f.id}
                      type="button"
                      onClick={() => pick(f.id)}
                      className={`list-item-active w-full text-left px-4 py-3 text-sm border-b border-zinc-800/40 flex justify-between items-center ${f.id === value ? 'text-emerald-400' : 'text-zinc-200'}`}
                    >
                      <span className="truncate pr-2">{f.isFavorite ? '⭐️ ' : ''}{f.name}</span>
                      <span className="text-[10px] text-zinc-500 shrink-0">{f.calories} ккал</span>
                    </button>
                  ))}
                </div>
              </div>
            </>
          )}
        </div>
      );
    };

    const getLocalDateString = (dateObj) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getDefaultStartDate = () => {
      const d = new Date();
      d.setMonth(d.getMonth() - 1);
      return getLocalDateString(d);
    };

    const displayDate = (dateString) => {
      const [year, month, day] = dateString.split('-');
      const d = new Date(year, month - 1, day);
      const todayStr = getLocalDateString(new Date());
      if (dateString === todayStr) return 'Сегодня';
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (dateString === getLocalDateString(yesterday)) return 'Вчера';
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [showReportView, setShowReportView] = useState(false);
      const [isPrinting, setIsPrinting] = useState(false);

      const defaultGoals = { calories: 1800, protein: 150, fats: 60, carbs: 150, baseSteps: 6000, maintenance: 2300 };
      const [goals, setGoals] = useState(defaultGoals);
      const [draftGoals, setDraftGoals] = useState(defaultGoals);
      const [dailyGoals, setDailyGoals] = useState({});

      const [foods, setFoods] = useState([]);
      const [dailyLogs, setDailyLogs] = useState({});
      const [dailySteps, setDailySteps] = useState({});
      const [dailyMetrics, setDailyMetrics] = useState({});
      const [dailyWorkouts, setDailyWorkouts] = useState({});

      const [currentDate, setCurrentDate] = useState(getLocalDateString(new Date()));
      const [activeTab, setActiveTab] = useState('diary');

      const [selectedFoodId, setSelectedFoodId] = useState('');
      const [gramsInput, setGramsInput] = useState('');
      const [newFood, setNewFood] = useState({ name: '', cals: '', pro: '', fat: '', carb: '' });

      const [editingLogId, setEditingLogId] = useState(null);
      const [editingFoodId, setEditingFoodId] = useState(null);
      const [editValue, setEditValue] = useState({});
      const [modifier, setModifier] = useState({ type: null, value: '' });

      const [showExportModal, setShowExportModal] = useState(false);
      const [showGoalModal, setShowGoalModal] = useState(false);
      const [exportStart, setExportStart] = useState(getDefaultStartDate());
      const [exportEnd, setExportEnd] = useState(getLocalDateString(new Date()));

      const scrollContainerRef = useRef(null);
      const restoreInputRef = useRef(null);

      useEffect(() => {
        const unsubscribe = docRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.goals) {
                setGoals({...goals, ...data.goals});
                if (isLoading) setDraftGoals({...goals, ...data.goals});
            }
            if (data.dailyGoals) setDailyGoals(data.dailyGoals);
            if (data.foods) setFoods(data.foods);
            else setFoods(HARDCODED_FOODS);
            if (data.dailyLogs) setDailyLogs(data.dailyLogs);
            if (data.dailySteps) setDailySteps(data.dailySteps);
            if (data.dailyMetrics) setDailyMetrics(data.dailyMetrics);
            if (data.dailyWorkouts) setDailyWorkouts(data.dailyWorkouts);
          } else {
            setFoods(HARDCODED_FOODS);
          }
          setIsLoading(false);
        }, (error) => {
           console.log("Firebase error", error);
           setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!showReportView && scrollContainerRef.current) {
            scrollContainerRef.current.scrollTop = 0;
        }
      }, [activeTab, showReportView]);

      const startExport = () => {
        setShowExportModal(false);
        setShowReportView(true);
      };

      const handlePrintClick = () => {
        setIsPrinting(true);

        const onAfterPrint = () => {
           setIsPrinting(false);
           window.removeEventListener('afterprint', onAfterPrint);
        };
        window.addEventListener('afterprint', onAfterPrint);

        setTimeout(() => {
          window.print();
          setTimeout(() => {
             setIsPrinting(false);
             window.removeEventListener('afterprint', onAfterPrint);
          }, 45000);
        }, 300);
      };

      const handleDraftGoalChange = (field, val) => setDraftGoals({ ...draftGoals, [field]: val });

      const confirmGoalSave = (mode) => {
        if (!confirm('Вы уверены, что хотите применить новые настройки?')) return;
        let updatedDailyGoals = { ...dailyGoals };
        if (mode === 'all') {
            updatedDailyGoals = {};
        } else if (mode === 'today') {
            const allDates = new Set([...Object.keys(dailyLogs), ...Object.keys(dailySteps)]);
            const todayStr = getLocalDateString(new Date());
            allDates.forEach(date => {
                if (date < todayStr && !updatedDailyGoals[date]) updatedDailyGoals[date] = { ...goals };
            });
        }
        docRef.set({ goals: draftGoals, dailyGoals: updatedDailyGoals }, { merge: true });
        setGoals(draftGoals); setDailyGoals(updatedDailyGoals); setShowGoalModal(false);
      };

      const getEffectiveGoals = (date) => dailyGoals[date] || goals;

      const handleUpdateSteps = (val) => {
        const num = parseInt(val);
        const updated = { ...dailySteps, [currentDate]: isNaN(num) ? '' : num };
        setDailySteps(updated);
        docRef.set({ dailySteps: updated }, { merge: true });
      };

      const handleUpdateMetrics = (field, val) => {
        const num = parseFloat(val);
        const currentDayMetrics = dailyMetrics[currentDate] || {};
        const updatedDay = { ...currentDayMetrics, [field]: isNaN(num) ? '' : num };
        const updated = { ...dailyMetrics, [currentDate]: updatedDay };
        setDailyMetrics(updated);
        docRef.set({ dailyMetrics: updated }, { merge: true });
      };

      // Отметка силовой тренировки в текущий день
      const toggleWorkout = () => {
        const updated = { ...dailyWorkouts, [currentDate]: !dailyWorkouts[currentDate] };
        if (!updated[currentDate]) delete updated[currentDate];
        setDailyWorkouts(updated);
        docRef.set({ dailyWorkouts: updated }, { merge: true });
      };

      // Скопировать все приёмы пищи с предыдущего дня в текущий
      const copyPreviousDay = () => {
        const d = new Date(currentDate);
        d.setDate(d.getDate() - 1);
        const prev = getLocalDateString(d);
        const prevLogs = dailyLogs[prev] || [];
        if (prevLogs.length === 0) {
          alert('За «' + displayDate(prev) + '» нет записей для копирования.');
          return;
        }
        if (!confirm('Скопировать ' + prevLogs.length + ' записей из «' + displayDate(prev) + '» в текущий день?')) return;
        const copied = prevLogs.map((l, i) => ({ ...l, id: (Date.now() + i).toString() }));
        const updatedLogs = { ...dailyLogs, [currentDate]: [...(dailyLogs[currentDate] || []), ...copied] };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
      };

      const handleAddLog = (e) => {
        e.preventDefault();
        const food = foods.find(f => f.id === selectedFoodId);
        if (!food || !gramsInput) return;

        const grams = evaluateMath(gramsInput);
        if (grams <= 0) return;

        const newLog = {
          id: Date.now().toString(), foodId: food.id, grams,
          totalCalories: Math.round((grams / 100) * (food.calories || 0)),
          totalProtein: Math.round((grams / 100) * (food.protein || 0)),
          totalFats: Math.round((grams / 100) * (food.fats || 0)),
          totalCarbs: Math.round((grams / 100) * (food.carbs || 0))
        };
        const updatedLogs = { ...dailyLogs, [currentDate]: [...(dailyLogs[currentDate] || []), newLog] };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
        setSelectedFoodId(''); setGramsInput('');
      };

      const submitEdit = (logId) => {
        let base = parseFloat(editValue.grams) || 0;
        let mod = parseFloat(modifier.value) || 0;
        let finalGrams = base;

        if (modifier.type === '+') finalGrams += mod;
        if (modifier.type === '-') finalGrams -= mod;

        finalGrams = Math.max(0, Math.round(finalGrams * 10) / 10);

        if (finalGrams <= 0) {
            setEditingLogId(null);
            setModifier({type: null, value: ''});
            return;
        }

        updateLogWeight(logId, finalGrams);
      };

      const updateLogWeight = (logId, finalGrams) => {
        const logToUpdate = (dailyLogs[currentDate] || []).find(l => l.id === logId);
        if (logToUpdate && logToUpdate.grams === finalGrams) {
            setEditingLogId(null);
            setModifier({type: null, value: ''});
            return;
        }

        const dayLogs = dailyLogs[currentDate].map(log => {
          if (log.id === logId) {
            const food = foods.find(f => f.id === log.foodId);
            return {
              ...log, grams: finalGrams,
              totalCalories: Math.round((finalGrams / 100) * (food?.calories || 0)),
              totalProtein: Math.round((finalGrams / 100) * (food?.protein || 0)),
              totalFats: Math.round((finalGrams / 100) * (food?.fats || 0)),
              totalCarbs: Math.round((finalGrams / 100) * (food?.carbs || 0))
            };
          }
          return log;
        });
        const updatedLogs = { ...dailyLogs, [currentDate]: dayLogs };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
        setEditingLogId(null);
        setModifier({type: null, value: ''});
      };

      const deleteLog = (id) => {
        const updatedLogs = { ...dailyLogs, [currentDate]: dailyLogs[currentDate].filter(l => l.id !== id) };
        setDailyLogs(updatedLogs);
        docRef.set({ dailyLogs: updatedLogs }, { merge: true });
      };

      const handleAddFood = (e) => {
        e.preventDefault();
        const foodItem = {
          id: Date.now().toString(), name: newFood.name,
          calories: parseFloat(newFood.cals || 0),
          protein: parseFloat(newFood.pro || 0),
          fats: parseFloat(newFood.fat || 0),
          carbs: parseFloat(newFood.carb || 0), isFavorite: false
        };
        const updatedFoods = [foodItem, ...foods];
        setFoods(updatedFoods);
        docRef.set({ foods: updatedFoods }, { merge: true });
        setNewFood({ name: '', cals: '', pro: '', fat: '', carb: '' });
      };

      const updateFoodBase = (id) => {
        const updatedFoods = foods.map(f => f.id === id ? {
            ...f, name: editValue.name,
            calories: parseFloat(editValue.calories || 0),
            protein: parseFloat(editValue.protein || 0),
            fats: parseFloat(editValue.fats || 0),
            carbs: parseFloat(editValue.carbs || 0)
        } : f);
        setFoods(updatedFoods);

        const updatedLogs = { ...dailyLogs };
        Object.keys(updatedLogs).forEach(date => {
          updatedLogs[date] = updatedLogs[date].map(log => {
            if (log.foodId === id) {
              const grams = log.grams;
              return {
                ...log,
                totalCalories: Math.round((grams / 100) * (editValue.calories || 0)),
                totalProtein: Math.round((grams / 100) * (editValue.protein || 0)),
                totalFats: Math.round((grams / 100) * (editValue.fats || 0)),
                totalCarbs: Math.round((grams / 100) * (editValue.carbs || 0))
              };
            }
            return log;
          });
        });

        setDailyLogs(updatedLogs);
        docRef.set({ foods: updatedFoods, dailyLogs: updatedLogs }, { merge: true });
        setEditingFoodId(null);
      };

      const deleteFood = (e, id) => { e.stopPropagation(); const updatedFoods = foods.filter(x => x.id !== id); setFoods(updatedFoods); docRef.set({ foods: updatedFoods }, { merge: true }); };

      const toggleFavorite = (e, id, currentStatus) => {
        e.stopPropagation();
        const updatedFoods = foods.map(f => f.id === id ? { ...f, isFavorite: !currentStatus } : f);
        setFoods(updatedFoods);
        docRef.set({ foods: updatedFoods }, { merge: true });
      };

      const forceRefreshApp = () => window.location.href = window.location.pathname + '?v=' + Date.now();

      // ===== ЭКСПОРТ ДАННЫХ =====

      // CSV: посуточная сводка (для анализа в Excel / Google Sheets / pandas)
      const downloadDailyCSV = () => {
        const dates = new Set([
          ...Object.keys(dailyLogs).filter(d => d >= exportStart && d <= exportEnd),
          ...Object.keys(dailyMetrics).filter(d => d >= exportStart && d <= exportEnd),
          ...Object.keys(dailySteps).filter(d => d >= exportStart && d <= exportEnd),
          ...Object.keys(dailyWorkouts).filter(d => d >= exportStart && d <= exportEnd)
        ]);
        const sorted = Array.from(dates).sort();
        if (sorted.length === 0) { alert('Нет данных за выбранный период.'); return; }

        const header = ['Дата', 'Съедено_ккал', 'Белок_г', 'Жиры_г', 'Углеводы_г', 'Шаги', 'Расход_ккал', 'Дефицит_ккал', 'Тренировка', 'Вес_кг', 'Жир_проц', 'БЖМ_кг', 'Масса_жира_кг'];
        const rows = [header.join(';')];

        sorted.forEach(date => {
          const g = getEffectiveGoals(date);
          const bSteps = g.baseSteps || 6000;
          const bMaint = g.maintenance || 2300;
          const logs = dailyLogs[date] || [];
          const cals = logs.reduce((s, l) => s + (l.totalCalories || 0), 0);
          const pro = logs.reduce((s, l) => s + (l.totalProtein || 0), 0);
          const fat = logs.reduce((s, l) => s + (l.totalFats || 0), 0);
          const carb = logs.reduce((s, l) => s + (l.totalCarbs || 0), 0);
          const steps = dailySteps[date] !== undefined ? dailySteps[date] : bSteps;
          const burned = bMaint + Math.round((steps - bSteps) * 0.04);
          const deficit = burned - cals;
          const m = dailyMetrics[date] || {};
          const row = [
            date, cals, Math.round(pro), Math.round(fat), Math.round(carb),
            steps, burned, deficit,
            dailyWorkouts[date] ? 'да' : '',
            m.weight ?? '', m.fatPercent ?? '', m.leanMass ?? '', m.fatMass ?? ''
          ];
          rows.push(row.map(csvCell).join(';'));
        });

        // \uFEFF (BOM) — чтобы кириллица корректно открылась в Excel
        downloadFile(`diet_summary_${exportStart}_${exportEnd}.csv`, '\uFEFF' + rows.join('\n'), 'text/csv;charset=utf-8;');
      };

      // CSV: все приёмы пищи построчно
      const downloadMealsCSV = () => {
        const dates = Object.keys(dailyLogs)
          .filter(d => d >= exportStart && d <= exportEnd && dailyLogs[d].length > 0)
          .sort();
        if (dates.length === 0) { alert('Нет записей о еде за выбранный период.'); return; }

        const header = ['Дата', 'Время', 'Продукт', 'Граммы', 'Ккал', 'Белок_г', 'Жиры_г', 'Углеводы_г'];
        const rows = [header.join(';')];

        dates.forEach(date => {
          dailyLogs[date].forEach(log => {
            const food = foods.find(f => f.id === log.foodId);
            const time = new Date(parseInt(log.id)).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            const row = [
              date, time, food ? food.name : 'Удалено', log.grams,
              Math.round(log.totalCalories || 0), Math.round(log.totalProtein || 0),
              Math.round(log.totalFats || 0), Math.round(log.totalCarbs || 0)
            ];
            rows.push(row.map(csvCell).join(';'));
          });
        });

        downloadFile(`diet_meals_${exportStart}_${exportEnd}.csv`, '\uFEFF' + rows.join('\n'), 'text/csv;charset=utf-8;');
      };

      // JSON: полный бэкап всех данных
      const downloadBackupJSON = () => {
        const backup = {
          _app: 'diet-tracker',
          _version: 1,
          _exportedAt: new Date().toISOString(),
          goals, dailyGoals, foods, dailyLogs, dailySteps, dailyMetrics, dailyWorkouts
        };
        downloadFile(`diet_backup_${getLocalDateString(new Date())}.json`, JSON.stringify(backup, null, 2), 'application/json');
      };

      // Восстановление из JSON-бэкапа (merge: не удаляет существующие ключи, перезаписывает совпадающие)
      const handleRestoreFile = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (data._app !== 'diet-tracker') {
              if (!confirm('Файл не похож на бэкап этого приложения. Всё равно попробовать восстановить?')) {
                e.target.value = '';
                return;
              }
            }
            if (!confirm('Восстановить данные из файла? Текущие записи с совпадающими датами будут перезаписаны.')) {
              e.target.value = '';
              return;
            }
            const payload = {};
            ['goals', 'dailyGoals', 'foods', 'dailyLogs', 'dailySteps', 'dailyMetrics', 'dailyWorkouts'].forEach(k => {
              if (data[k] !== undefined) payload[k] = data[k];
            });
            docRef.set(payload, { merge: true });
            alert('Данные восстановлены. Приложение обновит экран автоматически.');
          } catch (err) {
            alert('Не удалось прочитать файл: ' + err.message);
          }
          e.target.value = '';
        };
        reader.readAsText(file);
      };

      // ===== РАСЧЁТЫ ТЕКУЩЕГО ДНЯ =====

      const activeGoals = getEffectiveGoals(currentDate);
      const baseStepsGoal = activeGoals.baseSteps || 6000;
      const baseMaintenance = activeGoals.maintenance || 2300;

      const todaySteps = dailySteps[currentDate] !== undefined ? dailySteps[currentDate] : baseStepsGoal;
      const extraCalories = Math.round((todaySteps - baseStepsGoal) * 0.04);
      const targetCalories = (Number(activeGoals.calories) || 0) + extraCalories;

      const currentDayLogs = dailyLogs[currentDate] || [];
      const totalCals = currentDayLogs.reduce((sum, log) => sum + (log.totalCalories || 0), 0);
      const totalPro = currentDayLogs.reduce((sum, log) => sum + (log.totalProtein || 0), 0);
      const totalFats = currentDayLogs.reduce((sum, log) => sum + (log.totalFats || 0), 0);
      const totalCarbs = currentDayLogs.reduce((sum, log) => sum + (log.totalCarbs || 0), 0);

      const isOver = totalCals > targetCalories;
      const displayCals = isOver ? (totalCals - targetCalories) : (targetCalories - totalCals);
      const calsColorClass = isOver ? "text-red-500" : "text-emerald-400";
      const calsLabel = isOver ? "перебор" : "осталось";

      const progressCals = Math.min(100, (totalCals / (targetCalories || 1)) * 100);

      const sortedFoods = [...foods].sort((a, b) => {
        if (a.isFavorite && !b.isFavorite) return -1;
        if (!a.isFavorite && b.isFavorite) return 1;
        return a.name.localeCompare(b.name, 'ru');
      });

      // ===== ДАННЫЕ ДЛЯ ОТЧЁТА =====

      const allDatesSet = new Set([
         ...Object.keys(dailyLogs).filter(d => d >= exportStart && d <= exportEnd),
         ...Object.keys(dailyMetrics).filter(d => d >= exportStart && d <= exportEnd),
         ...Object.keys(dailySteps).filter(d => d >= exportStart && d <= exportEnd)
      ]);
      const allExportDates = Array.from(allDatesSet).sort((a, b) => new Date(a) - new Date(b));

      const filteredDatesForPdf = Object.keys(dailyLogs)
        .filter(date => date >= exportStart && date <= exportEnd && dailyLogs[date].length > 0)
        .sort((a, b) => new Date(a) - new Date(b));

      let totalPeriodCals = 0;
      let totalPeriodBurned = 0;
      let totalPeriodSteps = 0;

      filteredDatesForPdf.forEach(date => {
          const dayActiveGoals = getEffectiveGoals(date);
          const bSteps = dayActiveGoals.baseSteps || 6000;
          const bMaint = dayActiveGoals.maintenance || 2300;
          const dayLogs = dailyLogs[date] || [];
          const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
          const daySteps = dailySteps[date] !== undefined ? dailySteps[date] : bSteps;
          const extraCals = Math.round((daySteps - bSteps) * 0.04);
          const dayBurned = bMaint + extraCals;

          totalPeriodCals += dayCals;
          totalPeriodBurned += dayBurned;
          totalPeriodSteps += daySteps;
      });

      const periodDeficit = totalPeriodBurned - totalPeriodCals;
      const avgDeficit = filteredDatesForPdf.length ? Math.round(periodDeficit / filteredDatesForPdf.length) : 0;
      const periodDefText = periodDeficit > 0 ? `Дефицит: +${periodDeficit} ккал 🔥` : `Профицит: ${Math.abs(periodDeficit)} ккал 📈`;

      const allDatesInRange = new Set([ ...filteredDatesForPdf, ...Object.keys(dailyMetrics).filter(d => d >= exportStart && d <= exportEnd) ]);
      const datesWithMetrics = Array.from(allDatesInRange).sort().filter(date => {
         const m = dailyMetrics[date]; return m && (m.weight || m.fatPercent || m.leanMass || m.fatMass);
      });

      const allWeight = datesWithMetrics.map(d => dailyMetrics[d]?.weight);
      const allFat = datesWithMetrics.map(d => dailyMetrics[d]?.fatPercent);
      const allLean = datesWithMetrics.map(d => dailyMetrics[d]?.leanMass);
      const allFatMass = datesWithMetrics.map(d => dailyMetrics[d]?.fatMass);
      const chartDates = datesWithMetrics.map(d => d.slice(5));

      // Скользящие средние (7 точек) для сглаживания шума
      const maWeight = calcMovingAverage(allWeight, 7);
      const maFat = calcMovingAverage(allFat, 7);
      const maLean = calcMovingAverage(allLean, 7);
      const maFatMass = calcMovingAverage(allFatMass, 7);

      const wStart = getFirstValidVal(allWeight), wEnd = getLastValidVal(allWeight);
      const fStart = getFirstValidVal(allFat), fEnd = getLastValidVal(allFat);
      const lStart = getFirstValidVal(allLean), lEnd = getLastValidVal(allLean);
      const fmStart = getFirstValidVal(allFatMass), fmEnd = getLastValidVal(allFatMass);

      const hasBodyData = wStart !== undefined || fStart !== undefined || lStart !== undefined || fmStart !== undefined;
      const hasUnsavedGoals = JSON.stringify(goals) !== JSON.stringify(draftGoals);

      // ===== ФАКТИЧЕСКИЙ TDEE И СКОРОСТЬ ИЗМЕНЕНИЯ =====
      // Идея: из суммы съеденных калорий и реального (сглаженного) изменения веса
      // считаем фактический расход. Это точнее формул, потому что основано на твоих данных.
      const computeTdee = () => {
        const weightDates = datesWithMetrics.filter(d => {
          const w = dailyMetrics[d]?.weight;
          return w !== undefined && w !== '' && !isNaN(w);
        });
        if (weightDates.length < 2) return null;

        const firstD = weightDates[0];
        const lastD = weightDates[weightDates.length - 1];
        const idxFirst = datesWithMetrics.indexOf(firstD);
        const idxLast = datesWithMetrics.indexOf(lastD);

        // сглаженный вес на краях периода (если есть), иначе сырой
        const wS = (maWeight[idxFirst] !== null && maWeight[idxFirst] !== undefined) ? maWeight[idxFirst] : Number(dailyMetrics[firstD].weight);
        const wE = (maWeight[idxLast] !== null && maWeight[idxLast] !== undefined) ? maWeight[idxLast] : Number(dailyMetrics[lastD].weight);

        const daysSpan = Math.round((new Date(lastD) - new Date(firstD)) / 86400000);
        if (daysSpan < 10) return { tooShort: true, daysSpan };

        const deltaW = wE - wS;

        // средний дневной приход калорий в окне взвешиваний
        let kcalSum = 0, daysWithLogs = 0;
        Object.keys(dailyLogs).forEach(d => {
          if (d >= firstD && d <= lastD && dailyLogs[d].length > 0) {
            kcalSum += dailyLogs[d].reduce((s, l) => s + (l.totalCalories || 0), 0);
            daysWithLogs++;
          }
        });
        if (daysWithLogs === 0) return null;

        const avgIntake = kcalSum / daysWithLogs;
        const dailyDeltaKcal = (deltaW * KCAL_PER_KG) / daysSpan; // < 0 при похудении
        const tdee = Math.round(avgIntake - dailyDeltaKcal);
        const ratePerWeek = deltaW / (daysSpan / 7);
        const coverage = daysWithLogs / (daysSpan + 1);

        // скорость по жиру (если есть данные)
        let fatRate = null;
        const fS = getFirstValidVal(allFat), fE = getLastValidVal(allFat);
        if (fS !== undefined && fE !== undefined && fS !== fE) {
          fatRate = (Number(fE) - Number(fS)) / (daysSpan / 7);
        }

        const declaredMaint = Number(goals.maintenance) || 0;

        return {
          firstD, lastD, daysSpan, deltaW,
          avgIntake: Math.round(avgIntake),
          tdee, ratePerWeek, fatRate,
          daysWithLogs, coverage, declaredMaint,
          diffFromDeclared: tdee - declaredMaint
        };
      };

      const tdeeStats = computeTdee();

      if (isLoading) {
        return (
          <div className="flex h-[100dvh] items-center justify-center bg-[#09090b] flex-col gap-4">
            <div className="loader"></div>
            <p className="text-zinc-500 font-bold text-sm tracking-widest uppercase">Загрузка...</p>
          </div>
        );
      }

      const ExportReport = () => (
        <div style={{ fontFamily: 'sans-serif', maxWidth: '800px', margin: '0 auto', fontSize: '12px', background: 'white', color: 'black' }}>
          <h1 style={{ fontSize: '20px', fontWeight: 'bold', marginBottom: '15px', textAlign: 'center' }}>Отчет по питанию ({exportStart} — {exportEnd})</h1>

          {allExportDates.length > 0 && (
            <div style={{ backgroundColor: '#f4f4f5', padding: '10px', borderRadius: '8px', marginBottom: '15px' }}>
              <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 5px 0' }}>Итоги за период:</h2>
              <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap' }}>
                 <div style={{ minWidth: '200px' }}>
                    <p><strong>Суммарно съедено:</strong> {totalPeriodCals} ккал</p>
                    <p><strong>Суммарно потрачено:</strong> {totalPeriodBurned} ккал</p>
                    <p><strong>Пройдено шагов:</strong> {totalPeriodSteps}</p>
                 </div>
                 <div style={{ minWidth: '200px' }}>
                    <p><strong>Баланс ККАЛ:</strong> {periodDefText}</p>
                    <p style={{ color: '#555' }}><em>(В среднем {avgDeficit} ккал/день)</em></p>
                 </div>
              </div>
            </div>
          )}

          {tdeeStats && !tdeeStats.tooShort && (
            <div style={{ backgroundColor: '#ecfdf5', padding: '12px', borderRadius: '8px', marginBottom: '15px', border: '1px solid #a7f3d0' }}>
              <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 8px 0', color: '#065f46' }}>Аналитика (расчёт по фактическим данным):</h2>
              <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: '10px' }}>
                <div style={{ minWidth: '230px' }}>
                  <p><strong>Период анализа:</strong> {tdeeStats.daysSpan} дн. ({tdeeStats.firstD} → {tdeeStats.lastD})</p>
                  <p><strong>Изменение веса (сглаж.):</strong> <span style={{ color: tdeeStats.deltaW <= 0 ? '#059669' : '#dc2626', fontWeight: 'bold' }}>{tdeeStats.deltaW > 0 ? '+' : ''}{tdeeStats.deltaW.toFixed(2)} кг</span></p>
                  <p><strong>Скорость:</strong> <span style={{ fontWeight: 'bold' }}>{tdeeStats.ratePerWeek > 0 ? '+' : ''}{tdeeStats.ratePerWeek.toFixed(2)} кг/нед</span>{tdeeStats.fatRate !== null && <span> · жир {tdeeStats.fatRate > 0 ? '+' : ''}{tdeeStats.fatRate.toFixed(2)} %/нед</span>}</p>
                </div>
                <div style={{ minWidth: '230px' }}>
                  <p><strong>Средний приход:</strong> {tdeeStats.avgIntake} ккал/день</p>
                  <p><strong>Фактический расход (TDEE):</strong> <span style={{ fontWeight: 'bold', color: '#065f46' }}>≈ {tdeeStats.tdee} ккал/день</span></p>
                  <p><strong>Твоя оценка нормы:</strong> {tdeeStats.declaredMaint} ккал {tdeeStats.declaredMaint > 0 && <span style={{ color: '#555' }}>(расхождение {tdeeStats.diffFromDeclared > 0 ? '+' : ''}{tdeeStats.diffFromDeclared})</span>}</p>
                </div>
              </div>
              {tdeeStats.coverage < 0.8 && (
                <p style={{ color: '#b45309', fontSize: '11px', marginTop: '8px' }}>⚠️ Еда записана лишь в {tdeeStats.daysWithLogs} из ~{tdeeStats.daysSpan + 1} дней периода — реальный приход выше, поэтому TDEE может быть занижен.</p>
              )}
              <p style={{ color: '#6b7280', fontSize: '10px', marginTop: '6px' }}>Оценка основана на константе {KCAL_PER_KG} ккал/кг и точна только на длинном окне (от ~2 недель) при полном учёте еды. Используй как ориентир для сверки с целью, а не как абсолют.</p>
            </div>
          )}

          {tdeeStats && tdeeStats.tooShort && (
            <div style={{ backgroundColor: '#fffbeb', padding: '10px', borderRadius: '8px', marginBottom: '15px', border: '1px solid #fde68a', fontSize: '11px', color: '#92400e' }}>
              Для расчёта фактического TDEE нужно минимум 2 взвешивания и период от 10 дней (сейчас {tdeeStats.daysSpan} дн.). Продолжай вносить вес — расчёт появится.
            </div>
          )}

          {hasBodyData && (
            <div style={{ marginBottom: '15px' }}>
              <h3 style={{ fontSize: '14px', fontWeight: 'bold', margin: '10px 0 5px 0', color: '#005f73' }}>Изменения по телу:</h3>
              <table style={{ borderCollapse: 'collapse', textAlign: 'center', width: '100%' }}>
                <thead>
                  <tr style={{ backgroundColor: '#e2e8f0' }}>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Показатель</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Начало</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Конец</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Разница</th>
                  </tr>
                </thead>
                <tbody>
                  {wStart !== undefined && wEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Вес (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{wStart}</td><td style={{border:'1px solid #cbd5e1'}}>{wEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: wEnd - wStart > 0 ? '#ef4444' : '#10b981'}}>{(wEnd-wStart).toFixed(1)}</td></tr>}
                  {fStart !== undefined && fEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Жир (%)</td><td style={{border:'1px solid #cbd5e1'}}>{fStart}</td><td style={{border:'1px solid #cbd5e1'}}>{fEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: fEnd - fStart > 0 ? '#ef4444' : '#10b981'}}>{(fEnd-fStart).toFixed(1)}</td></tr>}
                  {lStart !== undefined && lEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>БЖМ (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{lStart}</td><td style={{border:'1px solid #cbd5e1'}}>{lEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: lEnd - lStart > 0 ? '#10b981' : '#ef4444'}}>{(lEnd-lStart).toFixed(1)}</td></tr>}
                  {fmStart !== undefined && fmEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Масса жира (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{fmStart}</td><td style={{border:'1px solid #cbd5e1'}}>{fmEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: fmEnd - fmStart > 0 ? '#ef4444' : '#10b981'}}>{(fmEnd-fmStart).toFixed(1)}</td></tr>}
                </tbody>
              </table>
            </div>
          )}

          {datesWithMetrics.length > 1 && (
            <div style={{ marginBottom: '20px' }}>
               <h3 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 10px 0', color: '#005f73' }}>Графики прогресса:</h3>
               <div className="grid grid-cols-1 print:grid-cols-2 sm:grid-cols-2 gap-4 w-full">
                  <ProgressChart title="Вес (кг)" data={allWeight} maData={maWeight} dates={chartDates} color="#3b82f6" />
                  <ProgressChart title="Жир (%)" data={allFat} maData={maFat} dates={chartDates} color="#ef4444" />
                  <ProgressChart title="БЖМ (кг)" data={allLean} maData={maLean} dates={chartDates} color="#8b5cf6" />
                  <ProgressChart title="Масса жира (кг)" data={allFatMass} maData={maFatMass} dates={chartDates} color="#f59e0b" />
               </div>
            </div>
          )}

          {allExportDates.map(date => {
              const dayActiveGoals = getEffectiveGoals(date);
              const dayLogs = dailyLogs[date] || [];
              if (dayLogs.length === 0 && !dailyMetrics[date] && dailySteps[date] === undefined) return null;

              const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
              const dayPro = dayLogs.reduce((s, l) => s + (l.totalProtein || 0), 0);
              const dayFat = dayLogs.reduce((s, l) => s + (l.totalFats || 0), 0);
              const dayCarb = dayLogs.reduce((s, l) => s + (l.totalCarbs || 0), 0);
              const dayBurned = (dayActiveGoals.maintenance || 2300) + Math.round(((dailySteps[date] || dayActiveGoals.baseSteps || 6000) - (dayActiveGoals.baseSteps || 6000)) * 0.04);
              const m = dailyMetrics[date] || {};
              const mText = [ m.weight ? `Вес: ${m.weight} кг` : '', m.fatPercent ? `Жир: ${m.fatPercent}%` : '', m.leanMass ? `БЖМ: ${m.leanMass} кг` : '', m.fatMass ? `Жир: ${m.fatMass} кг` : '' ].filter(Boolean).join(' | ');

              return (
                <div key={date} style={{ marginBottom: '15px', borderTop: '1px solid #eee', paddingTop: '8px' }}>
                  <h2 style={{ fontSize: '14px', fontWeight: 'bold', color: '#10b981', margin: '0 0 4px 0' }}>{date} {dailyWorkouts[date] ? '🏋️' : ''}</h2>
                  <p style={{ fontSize: '11px', marginBottom: '5px' }}>
                    Шаги: {dailySteps[date] || '—'} | <strong>Дефицит: {dayBurned - dayCals} ккал</strong>{dailyWorkouts[date] ? ' | Тренировка: да' : ''}<br/>
                    {dayLogs.length > 0 && <span>Б: {Math.round(dayPro)}г | Ж: {Math.round(dayFat)}г | У: {Math.round(dayCarb)}г</span>}
                    {mText && <span><br/><span style={{ color: '#005f73' }}>Тело: {mText}</span></span>}
                  </p>

                  {dayLogs.length > 0 && (
                    <table style={{ fontSize: '10px', width: '100%', borderCollapse: 'collapse' }}>
                      <thead style={{ backgroundColor: '#f9fafb' }}>
                        <tr>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', textAlign: 'left', width: '40%' }}>Продукт</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '15%' }}>Вес (г)</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '15%' }}>Ккал</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>Б</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>Ж</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>У</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dayLogs.map((log, i) => (
                          <tr key={i}>

                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalCalories)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalProtein)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalFats)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalCarbs)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              );
          })}
        </div>
      );

        return (
          <div style={{ backgroundColor: 'white', minHeight: '100vh', padding: '15px' }}>
            <div className="print-hide" style={{ display: 'flex', flexWrap: 'wrap', gap: '8px', justifyContent: 'space-between', marginBottom: '20px', paddingBottom: '15px', borderBottom: '2px solid #e4e4e7' }}>
               <button

                 className="btn-active"

               >
                 ⬅ Назад
               </button>
               <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                 <button onClick={downloadDailyCSV} disabled={isPrinting} className="btn-active" style={{ padding: '12px 16px', background: '#eef2ff', borderRadius: '12px', fontWeight: 'bold', color: '#3730a3', border: '1px solid #c7d2fe', fontSize: '13px', transition: 'all 0.1s' }}>CSV дни</button>
                 <button onClick={downloadMealsCSV} disabled={isPrinting} className="btn-active" style={{ padding: '12px 16px', background: '#eef2ff', borderRadius: '12px', fontWeight: 'bold', color: '#3730a3', border: '1px solid #c7d2fe', fontSize: '13px', transition: 'all 0.1s' }}>CSV еда</button>
                 <button
                   onClick={handlePrintClick}
                   disabled={isPrinting}
                   className="btn-active"
                   style={{ padding: '12px 20px', background: isPrinting ? '#059669' : '#10b981', borderRadius: '12px', fontWeight: 'bold', color: '#fff', border: 'none', fontSize: '14px', boxShadow: '0 4px 6px -1px rgba(16, 185, 129, 0.4)', transition: 'all 0.1s', opacity: isPrinting ? 0.8 : 1 }}
                 >
                   {isPrinting ? '⏳ Обработка...' : '🖨 PDF'}
                 </button>
               </div>
            </div>
            <ExportReport />
          </div>
        );

              <div>
                <h1 className="text-2xl font-bold">{activeTab === 'diary' ? 'Дневник' : 'База'}</h1>
              </div>
              <div className="flex items-center gap-2">
                {activeTab === 'directory' && (
                  <button onClick={forceRefreshApp} className="btn-active p-2 bg-zinc-800 rounded-xl text-zinc-300 transition-all"><IconRefresh className="w-5 h-5" /></button>

                {activeTab === 'diary' && (
                  <button onClick={() => setShowExportModal(true)} className="btn-active p-2 bg-zinc-800 rounded-xl text-zinc-300 transition-all"><IconDownload className="w-5 h-5" /></button>
                )}
              </div>
            </header>

            <main ref={scrollContainerRef} className="flex-1 overflow-y-auto px-5 pt-2 pb-8">
              {activeTab === 'diary' && (
                <div className="space-y-4">

                    <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate()-1); setCurrentDate(getLocalDateString(d));}} className="btn-active p-3 text-zinc-400"><IconChevronLeft className="w-5 h-5" /></button>
                    <div className="relative font-bold text-sm text-zinc-200 flex items-center justify-center cursor-pointer px-4">
                      {displayDate(currentDate)}
                      <input type="date" className="absolute opacity-0 top-0 left-0 w-full h-full cursor-pointer" value={currentDate} max={getLocalDateString(new Date())} onChange={(e) => { if(e.target.value) setCurrentDate(e.target.value); }} />
                    </div>
                    <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate()+1); setCurrentDate(getLocalDateString(d));}} disabled={currentDate === getLocalDateString(new Date())} className="btn-active p-3 text-zinc-400 disabled:opacity-20"><IconChevronRight className="w-5 h-5" /></button>
                  </div>

                  <div className="bg-[#18181b] rounded-3xl p-5 shadow-xl border border-zinc-800/50">
                    <div className="flex justify-between items-end mb-3">

                        <p className="text-[10px] text-zinc-500 uppercase font-bold mb-1 tracking-widest">Калории</p>
                        <div className="flex items-baseline gap-1">
                          <span className="text-4xl font-black">{totalCals}</span>
                          <span className="text-zinc-600 text-sm">/ {targetCalories}</span>
                        </div>
                      </div>
                      <div className={`text-right ${calsColorClass}`}>
                        <span className="text-2xl font-black">{displayCals}</span>
                        <p className="text-[10px] uppercase font-bold mt-1 tracking-widest opacity-80">{calsLabel}</p>
                      </div>
                    </div>
                    <div className="h-2 w-full bg-zinc-900 rounded-full overflow-hidden mb-5">
                      <div className={`h-full transition-all duration-500 ${isOver ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${progressCals}%` }}></div>
                    </div>

                    <div className="mt-4 mb-4 flex items-center justify-between bg-zinc-900/40 p-3 rounded-2xl border border-zinc-800/40">
                      <div className="flex items-center gap-3">
                        <span className="text-xl">👟</span>
                        <div className="flex flex-col">
                          <span className="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Шаги</span>
                          {extraCalories !== 0 && <span className={`text-[9px] font-bold mt-0.5 ${extraCalories > 0 ? 'text-emerald-400' : 'text-red-400'}`}>{extraCalories > 0 ? `+${extraCalories}` : extraCalories} ккал к цели</span>}
                        </div>
                      </div>
                      <input type="number" className="w-24 bg-zinc-800 rounded-xl p-2 text-center text-sm font-bold outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={todaySteps} onChange={(e) => handleUpdateSteps(e.target.value)} onFocus={(e) => e.target.select()} />
                    </div>

                    <button
                      onClick={toggleWorkout}
                      className={`btn-active w-full mb-4 flex items-center justify-center gap-2 p-3 rounded-2xl border font-bold text-sm transition-all ${dailyWorkouts[currentDate] ? 'bg-rose-600/20 border-rose-500/50 text-rose-300' : 'bg-zinc-900/40 border-zinc-800/40 text-zinc-500'}`}
                    >
                      <IconDumbbell className="w-5 h-5" />
                      {dailyWorkouts[currentDate] ? 'Силовая тренировка ✓' : 'Отметить тренировку'}
                    </button>

                    <div className="grid grid-cols-4 gap-2 mb-4">
                      {['weight', 'fatPercent', 'leanMass', 'fatMass'].map((field, i) => (
                        <div key={field} className="bg-[#27272a] rounded-xl p-2 flex flex-col items-center border border-zinc-700/50">
                          <span className="text-[8px] text-zinc-400 uppercase font-bold tracking-widest mb-1 text-center leading-tight">
                            {field === 'weight' ? 'Вес' : field === 'fatPercent' ? 'Жир %' : field === 'leanMass' ? 'БЖМ' : 'Жир кг'}
