<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Трекер Диеты</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body { background-color: #000; margin: 0; padding: 0; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    .safe-pb { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    
    .btn-active:active:not(:disabled) { transform: scale(0.96); opacity: 0.8; }
    .list-item-active:active { background-color: #27272a !important; }
    
    input[type="number"]::-webkit-inner-spin-button, 
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    
    .loader { border: 3px solid #27272a; border-top: 3px solid #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    @media print {
      body { background-color: white !important; color: black !important; }
      .print-hide { display: none !important; }
      @page { margin: 10mm; }
      
      .avoid-break { page-break-inside: auto !important; break-inside: auto !important; margin-bottom: 10px !important; }
      tr { page-break-inside: avoid !important; }
      h1, h2, h3 { page-break-after: avoid !important; page-break-inside: avoid !important; }
      
      table { width: 100%; border-collapse: collapse; margin-bottom: 8px !important; }
      p { margin: 2px 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const firebaseConfig = {
      apiKey: "AIzaSyBg9rVgF6WUjuu9abFvV_1KCHdSW3fZ5uQ",
      authDomain: "my-test-db-de78c.firebaseapp.com",
      projectId: "my-test-db-de78c",
      storageBucket: "my-test-db-de78c.firebasestorage.app",
      messagingSenderId: "30801099639",
      appId: "1:30801099639:web:585da0bba1f27d4a6fff72",
      measurementId: "G-KW2YVT1ZJW"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
      firebase.firestore().enablePersistence().catch((err) => {
        console.warn("Firebase persistence error:", err.code);
      });
    }
    const db = firebase.firestore();
    const docRef = db.collection('users').doc('main_profile');

    const { useState, useEffect, useRef } = React;

    const IconStar = ({className, fill}) => <svg className={className} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;
    const IconPlus = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 5v14m-7-7h14"/></svg>;
    const IconBook = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>;
    const IconCalendar = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const IconChevronLeft = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>;
    const IconChevronRight = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg>;
    const IconTrash = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>;
    const IconTarget = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>;
    const IconCheck = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>;
    const IconDownload = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4m4-5 5 5 5-5m-5 5V3"/></svg>;
    const IconRefresh = ({className}) => <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>;

    const HARDCODED_FOODS = [
      { id: 'h1', name: 'Котлета (говядина)', calories: 255, protein: 25, fats: 17, carbs: 0, isFavorite: false },
      { id: 'h2', name: 'Котлеты куриные', calories: 160, protein: 16, fats: 9, carbs: 4, isFavorite: false },
      { id: 'h4', name: 'Куриное филе (сырое)', calories: 113, protein: 23.6, fats: 1.9, carbs: 0, isFavorite: false },
      { id: 'h7', name: 'Гречка вареная', calories: 132, protein: 4.5, fats: 1.1, carbs: 26, isFavorite: false },
      { id: 'h13', name: 'Помидор', calories: 19, protein: 1, fats: 0.2, carbs: 4, isFavorite: false },
      { id: 'h14', name: 'Огурец', calories: 15, protein: 1, fats: 0.1, carbs: 3, isFavorite: false },
      { id: 'h18', name: 'Яйцо куриное (на 100г)', calories: 155, protein: 13, fats: 11, carbs: 1, isFavorite: false },
    ];

    const MacroBar = ({ label, current, goal, colorClass, bgClass }) => {
      const numGoal = Number(goal) || 1;
      const progress = Math.min(100, (current / numGoal) * 100);
      const remaining = Math.max(0, (Number(goal) || 0) - Math.round(current));
      return (
        <div className="w-full">
          <div className="flex justify-between items-end mb-1">
            <p className="text-[10px] text-zinc-500 uppercase font-bold tracking-widest">{label}</p>
            <span className={`text-[11px] font-bold ${colorClass}`}>{Math.round(current)} / {goal || 0}</span>
          </div>
          <div className="h-2 w-full bg-zinc-900 rounded-full overflow-hidden mb-1">
            <div className={`h-full transition-all duration-500 ${bgClass}`} style={{ width: `${progress}%` }}></div>
          </div>
          <p className="text-[9px] text-zinc-500 font-bold uppercase text-right opacity-80">Ост: {remaining}</p>
        </div>
      );
    };

    const ProgressChart = ({ title, data, dates, color }) => {
      if (!data || data.length < 2) return null;
      const validData = data.filter(d => d !== null && d !== undefined && !isNaN(d) && d !== '');
      if (validData.length < 2) return null;

      const min = Math.min(...validData);
      const max = Math.max(...validData);
      const range = max - min === 0 ? 1 : max - min;
      const padding = range * 0.15;
      const chartMin = min - padding;
      const chartMax = max + padding;

      const showLabels = data.length <= 15;

      return (
        <div className="avoid-break" style={{ width: '45%', display: 'inline-block', margin: '15px 2%', verticalAlign: 'top', fontFamily: 'sans-serif', boxSizing: 'border-box' }}>
          <h4 style={{ fontSize: '15px', fontWeight: 'bold', marginBottom: '10px', textAlign: 'center', color: '#333' }}>{title}</h4>
          <table style={{ width: '100%', height: '120px', borderBottom: '2px solid #cbd5e1', borderSpacing: 0, tableLayout: 'fixed' }}>
            <tbody>
              <tr>
                {data.map((val, i) => {
                   if (val === null || val === undefined || isNaN(val) || val === '') {
                     return <td key={i} style={{ padding: 0 }}></td>;
                   }
                   const pxHeight = Math.max(5, ((val - chartMin) / (chartMax - chartMin)) * 90);
                   return (
                     <td key={i} style={{ verticalAlign: 'bottom', padding: '0 1px', textAlign: 'center' }}>
                       {showLabels && <div style={{ fontSize: '9px', color: '#666', marginBottom: '2px', fontWeight: 'bold' }}>{val}</div>}
                       <div style={{ height: `${pxHeight}px`, backgroundColor: color, borderRadius: '2px 2px 0 0', width: '100%', maxWidth: '20px', margin: '0 auto' }}></div>
                     </td>
                   );
                })}
              </tr>
            </tbody>
          </table>
          <div style={{ fontSize: '11px', color: '#888', marginTop: '8px', fontWeight: 'bold' }}>
            <span style={{ float: 'left' }}>{dates[0]}</span>
            <span style={{ float: 'right' }}>{dates[dates.length - 1]}</span>
            <div style={{ clear: 'both' }}></div>
          </div>
        </div>
      );
    };

    const getLocalDateString = (dateObj) => {
      const year = dateObj.getFullYear();
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const getDefaultStartDate = () => {
      const d = new Date();
      d.setMonth(d.getMonth() - 1);
      return getLocalDateString(d);
    };

    const displayDate = (dateString) => {
      const [year, month, day] = dateString.split('-');
      const d = new Date(year, month - 1, day);
      const todayStr = getLocalDateString(new Date());
      if (dateString === todayStr) return 'Сегодня';
      const yesterday = new Date();
      yesterday.setDate(yesterday.getDate() - 1);
      if (dateString === getLocalDateString(yesterday)) return 'Вчера';
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    function App() {
      const [isLoading, setIsLoading] = useState(true);
      const [showReportView, setShowReportView] = useState(false);
      const [isPrinting, setIsPrinting] = useState(false); // Блокировка печати
      
      const defaultGoals = { calories: 1800, protein: 150, fats: 60, carbs: 150, baseSteps: 6000, maintenance: 2300 };
      const [goals, setGoals] = useState(defaultGoals);
      const [draftGoals, setDraftGoals] = useState(defaultGoals);
      const [dailyGoals, setDailyGoals] = useState({});
      
      const [foods, setFoods] = useState([]);
      const [dailyLogs, setDailyLogs] = useState({});
      const [dailySteps, setDailySteps] = useState({});
      const [dailyMetrics, setDailyMetrics] = useState({});
      
      const [currentDate, setCurrentDate] = useState(getLocalDateString(new Date()));
      const [activeTab, setActiveTab] = useState('diary');
      
      const [selectedFoodId, setSelectedFoodId] = useState('');
      const [gramsInput, setGramsInput] = useState('');
      const [newFood, setNewFood] = useState({ name: '', cals: '', pro: '', fat: '', carb: '' });

      const [editingLogId, setEditingLogId] = useState(null);
      const [editingFoodId, setEditingFoodId] = useState(null);
      const [editValue, setEditValue] = useState({});

      const [showExportModal, setShowExportModal] = useState(false);
      const [showGoalModal, setShowGoalModal] = useState(false);
      const [exportStart, setExportStart] = useState(getDefaultStartDate());
      const [exportEnd, setExportEnd] = useState(getLocalDateString(new Date()));

      const scrollContainerRef = useRef(null);

      useEffect(() => {
        const unsubscribe = docRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            const data = docSnap.data();
            if (data.goals) {
                setGoals({...goals, ...data.goals});
                if (isLoading) setDraftGoals({...goals, ...data.goals});
            }
            if (data.dailyGoals) setDailyGoals(data.dailyGoals);
            if (data.foods) setFoods(data.foods);
            if (data.dailyLogs) setDailyLogs(data.dailyLogs);
            if (data.dailySteps) setDailySteps(data.dailySteps);
            if (data.dailyMetrics) setDailyMetrics(data.dailyMetrics);
          } else {
            setFoods(HARDCODED_FOODS);
          }
          setIsLoading(false);
        }, (error) => {
           console.log("Firebase error", error);
           setIsLoading(false);
        });
        return () => unsubscribe();
      }, []);

      useEffect(() => {
        if (!showReportView && scrollContainerRef.current) {
            scrollContainerRef.current.scrollTop = 0;
        }
      }, [activeTab, showReportView]);

      const startExport = () => {
        setShowExportModal(false);
        setShowReportView(true);
      };

      // НОВАЯ, НАДЕЖНАЯ ФУНКЦИЯ ПЕЧАТИ
      const handlePrintClick = () => {
        setIsPrinting(true); 
        // 1. Даем React 300мс на отрисовку кнопки в заблокированном состоянии
        setTimeout(() => {
          window.print();
          // 2. iOS Safari блокирует процесс здесь, пока открыто системное окно.
          // Когда окно закроется, или если браузер вернет контроль досрочно (баг iOS),
          // мы снимем блокировку только через 4 секунды, чтобы интерфейс не мелькал.
          setTimeout(() => {
            setIsPrinting(false); 
          }, 4000); 
        }, 300);
      };

      const handleDraftGoalChange = (field, val) => setDraftGoals({ ...draftGoals, [field]: val });

      const confirmGoalSave = (mode) => {
        if (!confirm('Вы уверены, что хотите применить новые настройки?')) return;
        let updatedDailyGoals = { ...dailyGoals };
        if (mode === 'all') {
            updatedDailyGoals = {}; 
        } else if (mode === 'today') {
            const allDates = new Set([...Object.keys(dailyLogs), ...Object.keys(dailySteps)]);
            const todayStr = getLocalDateString(new Date());
            allDates.forEach(date => {
                if (date < todayStr && !updatedDailyGoals[date]) updatedDailyGoals[date] = { ...goals };
            });
        }
        docRef.set({ goals: draftGoals, dailyGoals: updatedDailyGoals }, { merge: true });
        setGoals(draftGoals); setDailyGoals(updatedDailyGoals); setShowGoalModal(false);
      };

      const getEffectiveGoals = (date) => dailyGoals[date] || goals;

      const handleUpdateSteps = (val) => {
        const num = parseInt(val);
        const updated = { ...dailySteps, [currentDate]: isNaN(num) ? '' : num };
        setDailySteps(updated); docRef.set({ dailySteps: updated }, { merge: true });
      };

      const handleUpdateMetrics = (field, val) => {
        const num = parseFloat(val);
        const currentDayMetrics = dailyMetrics[currentDate] || {};
        const updatedDay = { ...currentDayMetrics, [field]: isNaN(num) ? '' : num };
        const updated = { ...dailyMetrics, [currentDate]: updatedDay };
        setDailyMetrics(updated); docRef.set({ dailyMetrics: updated }, { merge: true });
      };

      const handleAddLog = (e) => {
        e.preventDefault();
        const food = foods.find(f => f.id === selectedFoodId);
        if (!food || !gramsInput) return;
        const grams = parseFloat(gramsInput);
        const newLog = {
          id: Date.now().toString(), foodId: food.id, grams,
          totalCalories: Math.round((grams / 100) * (food.calories || 0)),
          totalProtein: Math.round((grams / 100) * (food.protein || 0)),
          totalFats: Math.round((grams / 100) * (food.fats || 0)),
          totalCarbs: Math.round((grams / 100) * (food.carbs || 0))
        };
        const updatedLogs = { ...dailyLogs, [currentDate]: [...(dailyLogs[currentDate] || []), newLog] };
        setDailyLogs(updatedLogs); docRef.set({ dailyLogs: updatedLogs }, { merge: true });
        setSelectedFoodId(''); setGramsInput('');
      };

      const updateLogWeight = (logId, newGrams) => {
        const grams = parseFloat(newGrams) || 0;
        const dayLogs = dailyLogs[currentDate].map(log => {
          if (log.id === logId) {
            const food = foods.find(f => f.id === log.foodId);
            return {
              ...log, grams,
              totalCalories: Math.round((grams / 100) * (food?.calories || 0)),
              totalProtein: Math.round((grams / 100) * (food?.protein || 0)),
              totalFats: Math.round((grams / 100) * (food?.fats || 0)),
              totalCarbs: Math.round((grams / 100) * (food?.carbs || 0))
            };
          }
          return log;
        });
        const updatedLogs = { ...dailyLogs, [currentDate]: dayLogs };
        setDailyLogs(updatedLogs); docRef.set({ dailyLogs: updatedLogs }, { merge: true }); setEditingLogId(null);
      };

      const deleteLog = (id) => {
        const updatedLogs = { ...dailyLogs, [currentDate]: dailyLogs[currentDate].filter(l => l.id !== id) };
        setDailyLogs(updatedLogs); docRef.set({ dailyLogs: updatedLogs }, { merge: true });
      };

      const handleAddFood = (e) => {
        e.preventDefault();
        const foodItem = {
          id: Date.now().toString(), name: newFood.name,
          calories: Math.round(parseFloat(newFood.cals || 0)),
          protein: Math.round(parseFloat(newFood.pro || 0)),
          fats: Math.round(parseFloat(newFood.fat || 0)),
          carbs: Math.round(parseFloat(newFood.carb || 0)), isFavorite: false
        };
        const updatedFoods = [foodItem, ...foods];
        setFoods(updatedFoods); docRef.set({ foods: updatedFoods }, { merge: true });
        setNewFood({ name: '', cals: '', pro: '', fat: '', carb: '' });
      };

      const updateFoodBase = (id) => {
        const updatedFoods = foods.map(f => f.id === id ? { 
            ...f, name: editValue.name,
            calories: Math.round(parseFloat(editValue.calories || 0)),
            protein: Math.round(parseFloat(editValue.protein || 0)),
            fats: Math.round(parseFloat(editValue.fats || 0)),
            carbs: Math.round(parseFloat(editValue.carbs || 0))
        } : f);
        setFoods(updatedFoods);
        
        const updatedLogs = { ...dailyLogs };
        Object.keys(updatedLogs).forEach(date => {
          updatedLogs[date] = updatedLogs[date].map(log => {
            if (log.foodId === id) {
              const grams = log.grams;
              return {
                ...log,
                totalCalories: Math.round((grams / 100) * (editValue.calories || 0)),
                totalProtein: Math.round((grams / 100) * (editValue.protein || 0)),
                totalFats: Math.round((grams / 100) * (editValue.fats || 0)),
                totalCarbs: Math.round((grams / 100) * (editValue.carbs || 0))
              };
            }
            return log;
          });
        });

        setDailyLogs(updatedLogs); docRef.set({ foods: updatedFoods, dailyLogs: updatedLogs }, { merge: true }); setEditingFoodId(null);
      };

      const deleteFood = (e, id) => { e.stopPropagation(); const updatedFoods = foods.filter(x => x.id !== id); setFoods(updatedFoods); docRef.set({ foods: updatedFoods }, { merge: true }); };

      const toggleFavorite = (e, id, currentStatus) => {
        e.stopPropagation();
        const updatedFoods = foods.map(f => f.id === id ? { ...f, isFavorite: !currentStatus } : f);
        setFoods(updatedFoods); docRef.set({ foods: updatedFoods }, { merge: true });
      };

      const forceRefreshApp = () => window.location.href = window.location.pathname + '?v=' + Date.now();

      const activeGoals = getEffectiveGoals(currentDate);
      const baseStepsGoal = activeGoals.baseSteps || 6000;
      const baseMaintenance = activeGoals.maintenance || 2300;
      
      const todaySteps = dailySteps[currentDate] !== undefined ? dailySteps[currentDate] : baseStepsGoal;
      const extraCalories = Math.round((todaySteps - baseStepsGoal) * 0.04);
      const targetCalories = (Number(activeGoals.calories) || 0) + extraCalories;

      const currentDayLogs = dailyLogs[currentDate] || [];
      const totalCals = currentDayLogs.reduce((sum, log) => sum + (log.totalCalories || 0), 0);
      const totalPro = currentDayLogs.reduce((sum, log) => sum + (log.totalProtein || 0), 0);
      const totalFats = currentDayLogs.reduce((sum, log) => sum + (log.totalFats || 0), 0);
      const totalCarbs = currentDayLogs.reduce((sum, log) => sum + (log.totalCarbs || 0), 0);
      
      const isOver = totalCals > targetCalories;
      const displayCals = isOver ? (totalCals - targetCalories) : (targetCalories - totalCals);
      const calsColorClass = isOver ? "text-red-500" : "text-emerald-400";
      const calsLabel = isOver ? "перебор" : "осталось";
      
      const progressCals = Math.min(100, (totalCals / (targetCalories || 1)) * 100);
      
      const sortedFoods = [...foods].sort((a, b) => {
        if (a.isFavorite && !b.isFavorite) return -1;
        if (!a.isFavorite && b.isFavorite) return 1;
        return a.name.localeCompare(b.name, 'ru');
      });

      const allDatesSet = new Set([
         ...Object.keys(dailyLogs).filter(d => d >= exportStart && d <= exportEnd),
         ...Object.keys(dailyMetrics).filter(d => d >= exportStart && d <= exportEnd),
         ...Object.keys(dailySteps).filter(d => d >= exportStart && d <= exportEnd)
      ]);
      const allExportDates = Array.from(allDatesSet).sort((a, b) => new Date(a) - new Date(b));

      const filteredDatesForPdf = Object.keys(dailyLogs)
        .filter(date => date >= exportStart && date <= exportEnd && dailyLogs[date].length > 0)
        .sort((a, b) => new Date(a) - new Date(b));

      let totalPeriodCals = 0;
      let totalPeriodBurned = 0;
      let totalPeriodSteps = 0;

      filteredDatesForPdf.forEach(date => {
          const dayActiveGoals = getEffectiveGoals(date);
          const bSteps = dayActiveGoals.baseSteps || 6000;
          const bMaint = dayActiveGoals.maintenance || 2300;
          const dayLogs = dailyLogs[date] || [];
          const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
          const daySteps = dailySteps[date] !== undefined ? dailySteps[date] : bSteps;
          const extraCals = Math.round((daySteps - bSteps) * 0.04);
          const dayBurned = bMaint + extraCals;

          totalPeriodCals += dayCals;
          totalPeriodBurned += dayBurned;
          totalPeriodSteps += daySteps;
      });

      const periodDeficit = totalPeriodBurned - totalPeriodCals;
      const avgDeficit = filteredDatesForPdf.length ? Math.round(periodDeficit / filteredDatesForPdf.length) : 0;
      const periodDefText = periodDeficit > 0 ? `Дефицит: +${periodDeficit} ккал 🔥` : `Профицит: ${Math.abs(periodDeficit)} ккал 📈`;

      const allDatesInRange = new Set([ ...filteredDatesForPdf, ...Object.keys(dailyMetrics).filter(d => d >= exportStart && d <= exportEnd) ]);
      const datesWithMetrics = Array.from(allDatesInRange).sort().filter(date => {
         const m = dailyMetrics[date]; return m && (m.weight || m.fatPercent || m.leanMass || m.fatMass);
      });

      const allWeight = datesWithMetrics.map(d => dailyMetrics[d]?.weight);
      const allFat = datesWithMetrics.map(d => dailyMetrics[d]?.fatPercent);
      const allLean = datesWithMetrics.map(d => dailyMetrics[d]?.leanMass);
      const allFatMass = datesWithMetrics.map(d => dailyMetrics[d]?.fatMass);
      const chartDates = datesWithMetrics.map(d => d.slice(5)); 

      const getFirstValid = (arr) => arr.find(v => v !== null && v !== undefined && !isNaN(v) && v !== '');
      const getLastValid = (arr) => [...arr].reverse().find(v => v !== null && v !== undefined && !isNaN(v) && v !== '');

      const wStart = getFirstValid(allWeight), wEnd = getLastValid(allWeight);
      const fStart = getFirstValid(allFat), fEnd = getLastValid(allFat);
      const lStart = getFirstValid(allLean), lEnd = getLastValid(allLean);
      const fmStart = getFirstValid(allFatMass), fmEnd = getLastValid(allFatMass);

      const hasBodyData = wStart !== undefined || fStart !== undefined || lStart !== undefined || fmStart !== undefined;
      const hasUnsavedGoals = JSON.stringify(goals) !== JSON.stringify(draftGoals);

      if (isLoading) {
        return (
          <div className="flex h-[100dvh] items-center justify-center bg-[#09090b] flex-col gap-4">
            <div className="loader"></div>
            <p className="text-zinc-500 font-bold text-sm tracking-widest uppercase">Загрузка...</p>
          </div>

      }

      const ExportReport = () => (
        <div style={{ fontFamily: 'sans-serif', maxWidth: '800px', margin: '0 auto', fontSize: '12px', background: 'white', color: 'black' }}>
          <h1 style={{ fontSize: '20px', fontWeight: 'bold', marginBottom: '15px', textAlign: 'center' }}>Отчет по питанию ({exportStart} — {exportEnd})</h1>
          
          {allExportDates.length > 0 && (
            <div style={{ backgroundColor: '#f4f4f5', padding: '10px', borderRadius: '8px', marginBottom: '15px' }}>
              <h2 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 5px 0' }}>Итоги за период:</h2>
              <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap' }}>
                 <div style={{ minWidth: '200px' }}>
                    <p><strong>Суммарно съедено:</strong> {totalPeriodCals} ккал</p>
                    <p><strong>Суммарно потрачено:</strong> {totalPeriodBurned} ккал</p>
                    <p><strong>Пройдено шагов:</strong> {totalPeriodSteps}</p>
                 </div>
                 <div style={{ minWidth: '200px' }}>
                    <p><strong>Баланс ККАЛ:</strong> {periodDefText}</p>
                    <p style={{ color: '#555' }}><em>(В среднем {avgDeficit} ккал/день)</em></p>
                 </div>
              </div>
            </div>
          )}

          {hasBodyData && (
            <div style={{ marginBottom: '15px' }}>
              <h3 style={{ fontSize: '14px', fontWeight: 'bold', margin: '10px 0 5px 0', color: '#005f73' }}>Изменения по телу:</h3>
              <table style={{ borderCollapse: 'collapse', textAlign: 'center', width: '100%' }}>
                <thead>
                  <tr style={{ backgroundColor: '#e2e8f0' }}>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Показатель</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Начало</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Конец</th>
                    <th style={{ padding: '5px', border: '1px solid #cbd5e1' }}>Разница</th>
                  </tr>
                </thead>
                <tbody>
                  {wStart !== undefined && wEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Вес (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{wStart}</td><td style={{border:'1px solid #cbd5e1'}}>{wEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: wEnd - wStart > 0 ? '#ef4444' : '#10b981'}}>{(wEnd-wStart).toFixed(1)}</td></tr>}
                  {fStart !== undefined && fEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Жир (%)</td><td style={{border:'1px solid #cbd5e1'}}>{fStart}</td><td style={{border:'1px solid #cbd5e1'}}>{fEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: fEnd - fStart > 0 ? '#ef4444' : '#10b981'}}>{(fEnd-fStart).toFixed(1)}</td></tr>}
                  {lStart !== undefined && lEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>БЖМ (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{lStart}</td><td style={{border:'1px solid #cbd5e1'}}>{lEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: lEnd - lStart > 0 ? '#10b981' : '#ef4444'}}>{(lEnd-lStart).toFixed(1)}</td></tr>}
                  {fmStart !== undefined && fmEnd !== undefined && <tr><td style={{border:'1px solid #cbd5e1', padding:'5px'}}>Масса жира (кг)</td><td style={{border:'1px solid #cbd5e1'}}>{fmStart}</td><td style={{border:'1px solid #cbd5e1'}}>{fmEnd}</td><td style={{border:'1px solid #cbd5e1', fontWeight:'bold', color: fmEnd - fmStart > 0 ? '#ef4444' : '#10b981'}}>{(fmEnd-fmStart).toFixed(1)}</td></tr>}
                </tbody>
              </table>
            </div>
          )}

          {datesWithMetrics.length > 1 && (
            <div style={{ marginBottom: '20px', textAlign: 'center' }}>
               <h3 style={{ fontSize: '16px', fontWeight: 'bold', margin: '0 0 10px 0', color: '#005f73', textAlign: 'left' }}>Графики прогресса:</h3>
               <div style={{ display: 'block', textAlign: 'center' }}>
                  <ProgressChart title="Вес (кг)" data={allWeight} dates={chartDates} color="#3b82f6" />
                  <ProgressChart title="Жир (%)" data={allFat} dates={chartDates} color="#ef4444" />
                  <ProgressChart title="БЖМ (кг)" data={allLean} dates={chartDates} color="#8b5cf6" />
                  <ProgressChart title="Масса жира (кг)" data={allFatMass} dates={chartDates} color="#f59e0b" />
               </div>
            </div>
          )}

          {allExportDates.map(date => {
              const dayActiveGoals = getEffectiveGoals(date);
              const dayLogs = dailyLogs[date] || [];
              if (dayLogs.length === 0 && !dailyMetrics[date] && dailySteps[date] === undefined) return null;

              const dayCals = dayLogs.reduce((s, l) => s + (l.totalCalories || 0), 0);
              const dayPro = dayLogs.reduce((s, l) => s + (l.totalProtein || 0), 0);
              const dayFat = dayLogs.reduce((s, l) => s + (l.totalFats || 0), 0);
              const dayCarb = dayLogs.reduce((s, l) => s + (l.totalCarbs || 0), 0);
              const dayBurned = (dayActiveGoals.maintenance || 2300) + Math.round(((dailySteps[date] || dayActiveGoals.baseSteps || 6000) - (dayActiveGoals.baseSteps || 6000)) * 0.04);
              const m = dailyMetrics[date] || {};
              const mText = [ m.weight ? `Вес: ${m.weight} кг` : '', m.fatPercent ? `Жир: ${m.fatPercent}%` : '', m.leanMass ? `БЖМ: ${m.leanMass} кг` : '', m.fatMass ? `Жир: ${m.fatMass} кг` : '' ].filter(Boolean).join(' | ');

                      <thead style={{ backgroundColor: '#f9fafb' }}>
                        <tr>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', textAlign: 'left', width: '40%' }}>Продукт</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '15%' }}>Вес (г)</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '15%' }}>Ккал</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>Б</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>Ж</th>
                          <th style={{ border: '1px solid #e4e4e7', padding: '4px', width: '10%' }}>У</th>
                        </tr>
                      </thead>
                      <tbody>
                        {dayLogs.map((log, i) => (
                          <tr key={i}>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px' }}>{foods.find(f => f.id === log.foodId)?.name || '—'}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{log.grams}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalCalories)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalProtein)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalFats)}</td>
                            <td style={{ border: '1px solid #e4e4e7', padding: '3px', textAlign: 'center' }}>{Math.round(log.totalCarbs)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              );
          })}
        </div>
      );

      // ЕСЛИ ВКЛЮЧЕН РЕЖИМ ПРЕДПРОСМОТРА ОТЧЕТА
      if (showReportView) {
        return (
          <div style={{ backgroundColor: 'white', minHeight: '100vh', padding: '15px' }}>
            <div className="print-hide" style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '20px', paddingBottom: '15px', borderBottom: '2px solid #e4e4e7' }}>
               <button 
                 onClick={() => setShowReportView(false)} 
                 disabled={isPrinting}
                 className="btn-active" 
                 style={{ padding: '12px 20px', background: '#f4f4f5', borderRadius: '12px', fontWeight: 'bold', color: isPrinting ? '#a1a1aa' : '#18181b', border: '1px solid #d4d4d8', fontSize: '14px', transition: 'all 0.1s', opacity: isPrinting ? 0.5 : 1 }}
               >
                 ⬅ Назад
               </button>
               <button 
                 onClick={handlePrintClick} 
                 disabled={isPrinting}
                 className="btn-active" 
                 style={{ padding: '12px 20px', background: isPrinting ? '#059669' : '#10b981', borderRadius: '12px', fontWeight: 'bold', color: '#fff', border: 'none', fontSize: '14px', boxShadow: '0 4px 6px -1px rgba(16, 185, 129, 0.4)', transition: 'all 0.1s', opacity: isPrinting ? 0.8 : 1 }}
               >
                 {isPrinting ? '⏳ Обработка...' : '🖨 Сохранить PDF'}
               </button>
            </div>
            <ExportReport />
          </div>
        );
      }

      // ОСНОВНОЙ ИНТЕРФЕЙС ПРИЛОЖЕНИЯ
      return (
        <div className="flex flex-col h-[100dvh] w-full max-w-md mx-auto bg-[#09090b] text-zinc-100 font-sans shadow-2xl border-x border-zinc-900 relative">
            <header className="shrink-0 pt-8 px-6 pb-4 bg-[#09090b] flex justify-between items-center z-10">
              <div>
                <h1 className="text-2xl font-bold">{activeTab === 'diary' ? 'Дневник' : 'База'}</h1>
              </div>
              <div className="flex items-center gap-2">
                {activeTab === 'directory' && (
                  <button onClick={forceRefreshApp} className="btn-active p-2 bg-zinc-800 rounded-xl text-zinc-300 transition-all"><IconRefresh className="w-5 h-5" /></button>
                )}
                {activeTab === 'diary' && (
                  <button onClick={() => setShowExportModal(true)} className="btn-active p-2 bg-zinc-800 rounded-xl text-zinc-300 transition-all"><IconDownload className="w-5 h-5" /></button>
                )}
              </div>
            </header>

            <main ref={scrollContainerRef} className="flex-1 overflow-y-auto px-5 pt-2 pb-8">
              {activeTab === 'diary' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between bg-[#18181b] rounded-2xl p-1 border border-zinc-800/50">
                    <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate()-1); setCurrentDate(getLocalDateString(d));}} className="btn-active p-3 text-zinc-400"><IconChevronLeft className="w-5 h-5" /></button>
                    <div className="relative font-bold text-sm text-zinc-200 flex items-center justify-center cursor-pointer px-4">
                      {displayDate(currentDate)}
                      <input type="date" className="absolute opacity-0 top-0 left-0 w-full h-full cursor-pointer" value={currentDate} max={getLocalDateString(new Date())} onChange={(e) => { if(e.target.value) setCurrentDate(e.target.value); }} />
                    </div>
                    <button onClick={() => {const d = new Date(currentDate); d.setDate(d.getDate()+1); setCurrentDate(getLocalDateString(d));}} disabled={currentDate === getLocalDateString(new Date())} className="btn-active p-3 text-zinc-400 disabled:opacity-20"><IconChevronRight className="w-5 h-5" /></button>
                  </div>

                  <div className="bg-[#18181b] rounded-3xl p-5 shadow-xl border border-zinc-800/50">
                    <div className="flex justify-between items-end mb-3">
                      <div>
                        <p className="text-[10px] text-zinc-500 uppercase font-bold mb-1 tracking-widest">Калории</p>
                        <div className="flex items-baseline gap-1">
                          <span className="text-4xl font-black">{totalCals}</span>
                          <span className="text-zinc-600 text-sm">/ {targetCalories}</span>
                        </div>
                      </div>
                      <div className={`text-right ${calsColorClass}`}>
                        <span className="text-2xl font-black">{displayCals}</span>
                        <p className="text-[10px] uppercase font-bold mt-1 tracking-widest opacity-80">{calsLabel}</p>
                      </div>
                    </div>
                    <div className="h-2 w-full bg-zinc-900 rounded-full overflow-hidden mb-5">
                      <div className={`h-full transition-all duration-500 ${isOver ? 'bg-red-500' : 'bg-emerald-500'}`} style={{ width: `${progressCals}%` }}></div>
                    </div>

                    <div className="mt-4 mb-4 flex items-center justify-between bg-zinc-900/40 p-3 rounded-2xl border border-zinc-800/40">
                      <div className="flex items-center gap-3">
                        <span className="text-xl">👟</span>
                        <div className="flex flex-col">
                          <span className="text-[10px] text-zinc-400 uppercase font-bold tracking-widest">Шаги</span>
                          {extraCalories !== 0 && <span className={`text-[9px] font-bold mt-0.5 ${extraCalories > 0 ? 'text-emerald-400' : 'text-red-400'}`}>{extraCalories > 0 ? `+${extraCalories}` : extraCalories} ккал к цели</span>}
                        </div>
                      </div>
                      <input type="number" className="w-24 bg-zinc-800 rounded-xl p-2 text-center text-sm font-bold outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={todaySteps} onChange={(e) => handleUpdateSteps(e.target.value)} onFocus={(e) => e.target.select()} />
                    </div>

                    <div className="grid grid-cols-4 gap-2 mb-4">
                      {['weight', 'fatPercent', 'leanMass', 'fatMass'].map((field, i) => (
                        <div key={field} className="bg-[#27272a] rounded-xl p-2 flex flex-col items-center border border-zinc-700/50">
                          <span className="text-[8px] text-zinc-400 uppercase font-bold tracking-widest mb-1 text-center leading-tight">
                            {field === 'weight' ? 'Вес' : field === 'fatPercent' ? 'Жир %' : field === 'leanMass' ? 'БЖМ' : 'Жир кг'}
                          </span>
                          <input type="number" step="0.1" className="w-full bg-transparent text-center text-sm font-bold text-zinc-200 outline-none" value={dailyMetrics[currentDate]?.[field] || ''} onChange={(e) => handleUpdateMetrics(field, e.target.value)} onFocus={(e) => e.target.select()} />
                        </div>
                      ))}
                    </div>
                    
                    <div className="flex flex-col gap-3 mt-4 border-t border-zinc-800/50 pt-4">
                      <MacroBar label="Белок" current={totalPro} goal={activeGoals.protein} colorClass="text-indigo-400" bgClass="bg-indigo-500" />
                      <MacroBar label="Жиры" current={totalFats} goal={activeGoals.fats} colorClass="text-amber-400" bgClass="bg-amber-500" />

                    <select className="bg-[#27272a] rounded-2xl p-4 outline-none appearance-none text-zinc-200 text-sm font-medium truncate w-full border border-zinc-700/30 focus:border-emerald-500" value={selectedFoodId} onChange={(e) => setSelectedFoodId(e.target.value)} required>
                      <option value="" disabled>Выберите продукт</option>
                      {sortedFoods.map(f => <option key={f.id} value={f.id}>{f.isFavorite ? '⭐️ ' : ''}{f.name}</option>)}

                    <div className="flex gap-2">
                      <input type="number" placeholder="Вес (г)" className="flex-1 bg-[#27272a] rounded-2xl p-4 outline-none text-zinc-200 text-sm border border-zinc-700/30 focus:border-emerald-500" value={gramsInput} onChange={(e) => setGramsInput(e.target.value)} onFocus={(e) => e.target.select()} required />
                      <button type="submit" className="btn-active w-14 shrink-0 bg-emerald-600 rounded-2xl flex items-center justify-center transition-all shadow-lg shadow-emerald-900/20"><IconPlus className="w-6 h-6 text-white" /></button>
                    </div>
                  </form>

                  <div className="space-y-3 pt-2">
                    {currentDayLogs.map(log => (

                              <p className="font-bold text-sm text-zinc-200 leading-tight break-words">{foods.find(f => f.id === log.foodId)?.name || 'Удалено'}</p>
                              <p className="text-[10px] text-zinc-400 font-bold uppercase block mt-1">{log.grams}г</p>
                            </div>

                        <div className="flex items-center gap-3 shrink-0">

              {activeTab === 'directory' && (

                      <div><span className="text-[9px] text-zinc-500 font-bold block mb-1">БАЗА ШАГОВ</span><input type="number" className="w-full bg-[#27272a] rounded-xl p-3 text-zinc-300 font-bold outline-none border border-zinc-700/30 focus:border-indigo-500 transition-colors" value={draftGoals.baseSteps} onChange={(e) => handleDraftGoalChange('baseSteps', e.target.value === '' ? '' : parseInt(e.target.value))} /></div>
                      <div className="col-span-2"><span className="text-[9px] text-zinc-500 font-bold block mb-1">НОРМА (БЕЗ ДЕФИЦИТА)</span><input type="number" className="w-full bg-[#27272a] rounded-xl p-3 text-white font-bold outline-none border border-zinc-700/30 focus:border-indigo-500 transition-colors" value={draftGoals.maintenance} onChange={(e) => handleDraftGoalChange('maintenance', e.target.value === '' ? '' : parseInt(e.target.value))} /></div>
                      <div><span className="text-[9px] text-zinc-500 font-bold block mb-1">БЕЛОК (Г)</span><input type="number" className="w-full bg-[#27272a] rounded-xl p-3 text-indigo-400 font-bold outline-none border border-zinc-700/30 focus:border-indigo-500 transition-colors" value={draftGoals.protein} onChange={(e) => handleDraftGoalChange('protein', e.target.value === '' ? '' : parseFloat(e.target.value))} /></div>
                      <div><span className="text-[9px] text-zinc-500 font-bold block mb-1">ЖИРЫ (Г)</span><input type="number" className="w-full bg-[#27272a] rounded-xl p-3 text-amber-400 font-bold outline-none border border-zinc-700/30 focus:border-indigo-500 transition-colors" value={draftGoals.fats} onChange={(e) => handleDraftGoalChange('fats', e.target.value === '' ? '' : parseFloat(e.target.value))} /></div>
                      <div className="col-span-2"><span className="text-[9px] text-zinc-500 font-bold block mb-1">УГЛЕВОДЫ (Г)</span><input type="number" className="w-full bg-[#27272a] rounded-xl p-3 text-blue-400 font-bold outline-none border border-zinc-700/30 focus:border-indigo-500 transition-colors" value={draftGoals.carbs} onChange={(e) => handleDraftGoalChange('carbs', e.target.value === '' ? '' : parseFloat(e.target.value))} /></div>
                    </div>
                    {hasUnsavedGoals && <button onClick={() => setShowGoalModal(true)} className="btn-active w-full bg-indigo-600 text-white p-4 rounded-xl font-bold mt-4 shadow-lg shadow-indigo-900/30 transition-all">💾 Сохранить цели</button>}
                  </div>

                  <form onSubmit={handleAddFood} className="bg-[#18181b] rounded-3xl p-5 border border-zinc-800/50 space-y-4">
                    <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Добавить продукт (на 100г)</h2>
                    <input type="text" placeholder="Название" className="w-full bg-[#27272a] rounded-xl p-3 outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={newFood.name} onChange={(e) => setNewFood({...newFood, name: e.target.value})} required />
                    <div className="grid grid-cols-2 gap-3">
                      <input type="number" placeholder="Ккал" className="w-full bg-[#27272a] rounded-xl p-3 outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={newFood.cals} onChange={(e) => setNewFood({...newFood, cals: e.target.value})} required />
                      <input type="number" placeholder="Б (г)" className="w-full bg-[#27272a] rounded-xl p-3 outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={newFood.pro} onChange={(e) => setNewFood({...newFood, pro: e.target.value})} required />
                      <input type="number" placeholder="Ж (г)" className="w-full bg-[#27272a] rounded-xl p-3 outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={newFood.fat} onChange={(e) => setNewFood({...newFood, fat: e.target.value})} required />
                      <input type="number" placeholder="У (г)" className="w-full bg-[#27272a] rounded-xl p-3 outline-none text-zinc-200 border border-zinc-700/30 focus:border-emerald-500 transition-colors" value={newFood.carb} onChange={(e) => setNewFood({...newFood, carb: e.target.value})} required />
                    </div>
                    <button type="submit" className="btn-active w-full bg-emerald-600 text-white rounded-xl p-4 font-bold shadow-lg shadow-emerald-900/20 transition-all">Добавить в базу</button>
                  </form>

                  <div className="space-y-2">
                    <h2 className="text-[10px] font-bold text-zinc-500 uppercase tracking-widest mb-2 px-1">База продуктов ({foods.length})</h2>
                    {sortedFoods.map(f => (
                      <div key={f.id} className="list-item-active bg-[#18181b] rounded-xl p-3 border border-zinc-800/30 transition-colors">
                        {editingFoodId === f.id ? (
                          <div className="space-y-3">
                             <input autoFocus className="w-full bg-zinc-900 rounded-lg p-2 text-sm text-white border border-indigo-500 outline-none" value={editValue.name} onChange={e => setEditValue({...editValue, name: e.target.value})} />
                             <div className="grid grid-cols-2 gap-2">
                                <input type="number" placeholder="Ккал" className="bg-zinc-900 rounded-lg p-2 text-sm text-emerald-400 outline-none text-center" value={editValue.calories} onChange={e => setEditValue({...editValue, calories: parseFloat(e.target.value)})} />
                                <input type="number" placeholder="Белок" className="bg-zinc-900 rounded-lg p-2 text-sm text-indigo-400 outline-none text-center" value={editValue.protein} onChange={e => setEditValue({...editValue, protein: parseFloat(e.target.value)})} />
                                <input type="number" placeholder="Жиры" className="bg-zinc-900 rounded-lg p-2 text-sm text-amber-400 outline-none text-center" value={editValue.fats} onChange={e => setEditValue({...editValue, fats: parseFloat(e.target.value)})} />
                                <input type="number" placeholder="Углев" className="bg-zinc-900 rounded-lg p-2 text-sm text-blue-400 outline-none text-center" value={editValue.carbs} onChange={e => setEditValue({...editValue, carbs: parseFloat(e.target.value)})} />
                             </div>
                             <button onClick={() => updateFoodBase(f.id)} className="btn-active w-full bg-emerald-600 p-2 rounded-lg flex justify-center transition-all"><IconCheck className="w-5 h-5 text-white" /></button>
                          </div>
                        ) : (
                          <div className="flex justify-between items-center cursor-pointer">
                            <button onClick={(e) => toggleFavorite(e, f.id, f.isFavorite)} className="btn-active p-2 pl-0 transition-colors">
                              <IconStar className={`w-6 h-6 ${f.isFavorite ? 'text-amber-400' : 'text-zinc-700'}`} fill={f.isFavorite ? "currentColor" : "none"} />
                            </button>
                            <div className="flex-1" onClick={() => { setEditingFoodId(f.id); setEditValue({ ...f, fats: f.fats || 0, carbs: f.carbs || 0 }); }}>
                              <span className="text-sm font-medium border-b border-zinc-800/50 pb-0.5">{f.name}</span>
                              <div className="flex gap-3 text-[10px] font-bold uppercase mt-1.5 opacity-80">
                                <span className="text-emerald-500">{Math.round(f.calories || 0)}</span>
                                <span className="text-indigo-500">Б: {Math.round(f.protein || 0)}</span>
                                <span className="text-amber-500">Ж: {Math.round(f.fats || 0)}</span>
                                <span className="text-blue-500">У: {Math.round(f.carbs || 0)}</span>
                              </div>
                            </div>
                            <button onClick={(e) => deleteFood(e, f.id)} className="btn-active text-zinc-800 active:text-red-500 p-2 transition-colors"><IconTrash className="w-5 h-5" /></button>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </main>

            <nav className="shrink-0 bg-[#09090b] flex justify-around pb-2 pt-2 safe-pb relative z-40 border-t border-zinc-900">
              <button onClick={() => setActiveTab('diary')} className={`btn-active w-32 flex flex-col items-center py-2 transition-all rounded-xl ${activeTab === 'diary' ? 'text-emerald-400 bg-zinc-900/50' : 'text-zinc-600'}`}>
                <IconCalendar className="w-6 h-6" /><span className="text-[10px] font-bold mt-1 uppercase tracking-widest">Дневник</span>
              </button>
              <button onClick={() => setActiveTab('directory')} className={`btn-active w-32 flex flex-col items-center py-2 transition-all rounded-xl ${activeTab === 'directory' ? 'text-indigo-400 bg-zinc-900/50' : 'text-zinc-600'}`}>
                <IconBook className="w-6 h-6" /><span className="text-[10px] font-bold mt-1 uppercase tracking-widest">База</span>
              </button>
            </nav>

            {/* Модалки */}
            {showExportModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-[#18181b] p-6 rounded-3xl border border-zinc-800 w-full max-w-sm">
                  <h3 className="text-lg font-bold mb-4 text-center">Выгрузка в PDF</h3>
                  <div className="space-y-4 mb-6">
                    <div>
                      <label className="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Начало периода</label>
                      <div className="relative w-full bg-[#27272a] rounded-xl p-4 flex items-center justify-center border border-zinc-700/50">
                        <span className="text-zinc-200 font-bold">{displayDate(exportStart)}</span>
                        <input type="date" className="absolute opacity-0 top-0 left-0 w-full h-full cursor-pointer" value={exportStart} onChange={(e) => { if(e.target.value) setExportStart(e.target.value); }} />
                      </div>
                    </div>
                    <div>
                      <label className="text-[10px] text-zinc-500 uppercase font-bold block mb-1">Конец периода</label>
                      <div className="relative w-full bg-[#27272a] rounded-xl p-4 flex items-center justify-center border border-zinc-700/50">
                        <span className="text-zinc-200 font-bold">{displayDate(exportEnd)}</span>
                        <input type="date" className="absolute opacity-0 top-0 left-0 w-full h-full cursor-pointer" value={exportEnd} onChange={(e) => { if(e.target.value) setExportEnd(e.target.value); }} />
                      </div>
                    </div>
                  </div>
                  <div className="flex gap-3">
                    <button onClick={() => setShowExportModal(false)} className="btn-active flex-1 p-4 rounded-xl bg-zinc-800 font-bold text-zinc-300 transition-all">Отмена</button>
                    <button onClick={startExport} className="btn-active flex-1 p-4 rounded-xl bg-emerald-600 font-bold text-white transition-all">Перейти</button>
                  </div>
                </div>
              </div>
            )}

            {showGoalModal && (
              <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-[#18181b] p-6 rounded-3xl border border-zinc-800 w-full max-w-sm">
                  <h3 className="text-lg font-bold mb-3 text-center">Применить цели?</h3>
                  <p className="text-zinc-400 text-sm mb-6 text-center leading-relaxed">Выберите, с какого момента изменятся цели по КБЖУ</p>
                  <div className="flex flex-col gap-3">
                    <button onClick={() => confirmGoalSave('today')} className="btn-active w-full p-4 rounded-xl bg-emerald-600 font-bold text-white transition-all">Только с этого дня</button>
                    <button onClick={() => confirmGoalSave('all')} className="btn-active w-full p-4 rounded-xl bg-zinc-800 font-bold text-zinc-200 transition-all">Применить ко всей истории</button>
                    <button onClick={() => setShowGoalModal(false)} className="btn-active w-full p-4 rounded-xl border border-zinc-800 text-zinc-500 font-bold mt-2 transition-all">Отмена</button>
                  </div>
                </div>
              </div>
            )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
